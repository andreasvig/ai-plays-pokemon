[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-plays-pokemon"
version = "0.1.0"
description = "Vision-only AI agent that plays Pokemon FireRed."
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "Pillow>=10.0",
    "numpy>=1.21",
    "pytesseract>=0.3.10",
    "openai>=1.0",
    "pydantic-ai>=0.8.0,<0.9.0",
    "python-dotenv>=1.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
]

[project.scripts]
pokemon = "src.cli.main:main"

[tool.setuptools.packages.find]
include = ["src*"]
