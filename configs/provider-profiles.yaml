  # --- Z.AI GLM -------------------------------------------------------------
  z-ai/glm-5.3-flash:
    endpoint: z-ai/fp8
    context_length: 1048576
    max_completion_tokens: 131072
    reasoning_mandatory: true
    reasoning_efforts: [max, high, low]
    reasoning_default: {effort: high}
    cache_mode: implicit
    final_turn_text_only: false
    notes: 'Tools supported on the direct endpoint. Native clear_thinking:false has no confirmed OpenRouter passthrough; do not claim preserved internal reasoning. Campaign 2026-09-06: 67% hits on z-ai/fp8. $0.075/$0.25 per M, cache read $0.015 (80% off), no cache-write price. NOTE the registry entry declares output_mode: prompted while this profile leaves it at the default `tool`; on a profiled run the profile wins. Flagged for the validator rather than silently changed either way.'

  # --- MiniMax --------------------------------------------------------------
  minimax/minimax-m3:
    endpoint: minimax/fp8
    context_length: 524288
    max_completion_tokens: 512000
    reasoning_efforts: [thinking, non-thinking]
    reasoning_default: {enabled: true}
    # Replay probe 2026-09-07: minimax/fp8 bills the same 255 prompt tokens for all
    # seven replay shapes, padding included, so the replayed thoughts never reach
    # the model. Do not send them.
    reasoning_replay: omit_prior
    reasoning_use: not_consumed_by_endpoint
    cache_mode: implicit
    final_turn_text_only: false
    sampling: {temperature: 0.3, top_p: 0.95}
    notes: 'PROBED LIVE 2026-09-07 on the first-party minimax/fp8 tag, both probes. CACHE: implicit caching hits the whole prefix with no marker — A+turn cached 8,354 of 8,369 (shortfall 15) in the live shape and 8,377 of 8,392 in the split shape, so cache_mode implicit and final_turn_text_only false. REPLAY: dropped — none / harness / details_only / reasoning_only / reasoning_content / details_padded / reasoning_padded all billed 255 prompt tokens (delta 0, padded delta 0), hence omit_prior. BINARY reasoning axis (the catalog lists no supported_efforts and no endpoint advertises reasoning_effort). Own survey facts: $0.30/$1.20 per M, cache read $0.06 (80% off), no cache-write price, 524,288 context / 512,000 output on this tag — the model-wide row claims 1,048,576 context, which only parasail/gmicloud/novita serve. First-party chosen over the four endpoints tied at cache read $0.06. Sampling 0.3/0.95 moved here from the registry. Evidence: cache-hit-probe__minimax--minimax-m3.json, reasoning-replay-probe__minimax--minimax-m3.json.'

  # --- DeepSeek -------------------------------------------------------------
  deepseek/deepseek-v4-flash-vision-exp:
    endpoint: deepseek
    context_length: 1048576
    max_completion_tokens: 384000
    reasoning_efforts: [max, high, low]
    reasoning_default: {effort: high}
