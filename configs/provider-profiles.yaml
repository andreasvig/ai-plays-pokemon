    cache_mode: implicit
    final_turn_text_only: false
    notes: 'Native documentation says always-on thinking and OpenRouter''s catalog disagrees (reasoning.mandatory false, and the 2026-09-06 effort sweep got 0 reasoning tokens for an explicit off) — reasoning_mandatory stays true as the conservative reading, and the registry offers no off rung, so nothing depends on resolving it. Auto tool choice avoids incompatible named forced calls. Probe 2026-09-06: all 17 reachable endpoints, Moonshot included, drop replayed reasoning in every field; thinking is brief (~120 reasoning tokens at high, max is no higher). Registry `thinking_levels` had xhigh/medium/none, none of which OpenRouter supports for this model (supported_efforts max/high/low); all three were dropped. $3/$15 per M, cache read $0.30 (90% off), no cache-write price. moonshotai/mxfp4 advertises no temperature/top_p, so no sampling is sent.'

