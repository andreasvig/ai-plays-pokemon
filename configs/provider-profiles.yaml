# Append/compaction only. These are serving contracts, not claims of verified
# private reasoning use. Sources and probe results: docs/openrouter-provider-compatibility.md.
# Endpoint tags are OpenRouter tags (including quantization/tier where available).
version: 1
reviewed: '2026-09-07'
# Named variants inherit the model's base profile; names and reasoning_use are
# diagnostic metadata. Decision 2026-09-06: Gemma runs use guidance (omit_prior,
# the base profile) from now on. The replay variants stay selectable for
# re-probing only: 14 of 15 Gemma endpoints drop replayed reasoning, and on the
# one that consumes it (coreweave/fp4) replay went 0/2 against guidance 1/2.
variants:
  gemma-guidance:
    model: google/gemma-4-31b-it
    settings:
      reasoning_replay: omit_prior
      reasoning_use: not_preserved_between_user_turns
  gemma-replay:
    model: google/gemma-4-31b-it
    settings:
      reasoning_replay: all
      # Probe 2026-09-06: deepinfra/turbo bills zero tokens for replayed reasoning in
      # any field, so the replay never reaches the model on this endpoint.
      reasoning_use: not_consumed_by_endpoint
  # CoreWeave fp4 is the only Gemma endpoint (1 of 15) that tokenizes replayed
  # reasoning, so a real guidance-vs-replay comparison must pair both arms there.
  # CoreWeave lists a cache-read price equal to its prompt price: hits save nothing.
  gemma-guidance-coreweave:
    model: google/gemma-4-31b-it
    settings:
      endpoint: coreweave/fp4
      reasoning_replay: omit_prior
      reasoning_use: not_preserved_between_user_turns
  gemma-replay-coreweave:
    model: google/gemma-4-31b-it
    settings:
      endpoint: coreweave/fp4
      reasoning_replay: all
      reasoning_use: unverified
  # Unquantized control for gameplay quality (no replay; novita/bf16 drops it too).
  # Novita offers no prompt cache at all on this endpoint (no cache-read price, 0 hits).
  gemma-guidance-bf16:
    model: google/gemma-4-31b-it
    settings:
      endpoint: novita/bf16
      reasoning_replay: omit_prior
      reasoning_use: not_preserved_between_user_turns
defaults:
  output_mode: tool
  tool_choice: auto
  reasoning_replay: all
  reasoning_mandatory: false
  reasoning_efforts: []
  reasoning_default: {enabled: true}
  reasoning_use: unverified
  cache_mode: implicit
  cache_control: {type: ephemeral}
  sampling: {}
  excluded_endpoints: []
  allow_json_fence: false
  # Prompted-JSON replies that end with brackets still open (outside a string)
  # get the derived closers appended before validation, recorded as an
  # `output_coerced` event. Off by default: this IS a JSON repair, allowed per
  # model only where the defect is proven to be "the reply stops one closer
  # short" (qwen3.8-flash, 2026-09-12: 7 of 7 compaction replies at turn 101,
  # each exactly one `}` short with an otherwise identical memory structure).
  close_unbalanced_json: false
  # Prompted-JSON replies that put a sentence of prose BEFORE an otherwise
  # complete object get the object parsed and the prose recorded as an
  # `output_coerced` event (kind stripped_prose). Off by default, same doctrine
  # as above: allowed only where the defect is proven (claude-fable-5.1,
  # 2026-09-13: "Prediction correct: ..." then the object, 5 of 5 attempts at
  # turn 8). Text AFTER the object is not this defect and still retries.
  strip_leading_prose: false
  # Prompted-JSON models sometimes return the action/handover object without the
  # {"result": ...} envelope (Gemma after a handover, Qwen on compaction). The
  # schema validation is the real guard, so accept either shape everywhere.
  allow_unwrapped_json: true
  # Close each screenshot turn with a one-word assistant acknowledgement and end the request with a
  # text-only user prompt. OpenAI via OpenRouter cannot extend the prompt cache past the first image
  # when the request's final turn contains an image (2026-09-06: 25 Astra turns cached 1,192 tokens
  # each, 2.7x the sliding-window cost; the split shape cached the whole previous request).
  final_turn_text_only: false
  memory_encoding: object
  memory_wire_description: 'The complete flexible memory dictionary serialized as a JSON object string. Choose keys freely; the harness parses it back into a dictionary.'
  tool_descriptions:
    gameplay: 'Return the next game action on an ordinary observation turn. Use exactly this tool unless the user explicitly requests a handover.'
    compaction: 'Return the complete handover only when the user explicitly asks to pause gameplay and prepare a handover. Do not call gameplay on that request.'
# ============================================================================
# One profile per registry model (2026-09-07). The profile OWNS the endpoint and
# the legal reasoning ladder: `configs/models.yaml` no longer carries a
# `provider:` block for any of these, and every registry `thinking_levels` list
# is a subset of the `reasoning_efforts` below (tests/test_model_registry_collapse.py).
#
# reasoning_efforts is the source of truth the dialog and the config validator
# read, so it is written out per model and never inherited from `defaults`.
#   effort models  -> OpenRouter effort names, from that model's
#                     `reasoning.supported_efforts` in /api/v1/models.
#   binary models  -> [thinking, non-thinking]. These are LEVEL names, not
#                     efforts: the registry's `reasoning_type: binary` turns them
#                     into `reasoning {enabled: true|false}` and no `effort` is
#                     ever sent, so the effort check in resolve_provider_profile
#                     never fires. The list exists so the dialog and the
#                     registry-subset test have one legal set to read.
# cache_mode and final_turn_text_only are also written out per model rather than
# inherited: a change to `defaults` must not silently rewrite 21 transport
# contracts.
#
# Endpoint rule: the model author's own endpoint tag where one exists, otherwise
# the cheapest cache-read price. Facts (context, output ceiling, prices,
# quantization, supported params) come from
# artifacts/provider-compatibility/endpoint-survey-2026-09-07.md, which is a
# snapshot of GET /api/v1/models/{author}/{slug}/endpoints on that date.
# Family rule: one representative probed live, siblings carry `probed_as:` and
# their OWN survey facts (context, prices, efforts are never copied).
# ============================================================================
profiles:

  # --- OpenAI ---------------------------------------------------------------
  # gpt-6-astra is the ONE model here that needs final_turn_text_only. The
  # gpt-5.6 family does not, which is why all three siblings were probed
  # individually instead of copying from the representative: see the note on
  # gpt-5.6-sol.
  openai/gpt-6-astra:
    endpoint: openai
    context_length: 1050000
    max_completion_tokens: 128000
    reasoning_mandatory: true
    reasoning_efforts: [max, xhigh, high, medium, low]
    reasoning_default: {effort: medium}
    # Probe 2026-09-06 (openai tag, effort medium): replayed reasoning_details (reasoning.encrypted +
    # reasoning.summary items) are tokenized by the endpoint (+57 prompt tokens/turn); the bare
    # `reasoning` string is not. Caching is automatic on the whole prefix (8489/8492 tokens cached on
    # an 8.5k identical prefix, no marker) at a 90% read discount, so no cache_control is sent.
    cache_mode: implicit
    final_turn_text_only: true
    notes: 'Only effort medium verified live; other efforts follow the catalog ladder (reasoning.supported_efforts, mandatory true). $10/$50 per M prompt/completion on the openai tag, cache read $1.00, cache write $12.50 (openai/flex half price, openai/fast double). CACHING RULE: when the request''s final turn contains an image, the cache cannot be extended past the first image anywhere in the prompt; the agent ends every request with the screenshot, so the 25-turn run cached 1,192 tokens per turn and paid the 1.25x cache-write price on the rest (2.7x the sliding-window agent). final_turn_text_only fixes it: rerun cached 87%, $1.11 for 25 turns vs $4.61 (artifacts/provider-compatibility/openai-image-prefix-caching-probe.md). RE-CONFIRMED 2026-09-07 on this endpoint with a 415-token screenshot: live shape cached 7,719 of 8,158 tokens = exactly the pre-image system block (shortfall 439), split shape cached all of it. Astra at medium reports 0 reasoning tokens on ~90% of gameplay turns.'
  openai/gpt-5.6-sol:
    endpoint: openai
    context_length: 1050000
    max_completion_tokens: 128000
    reasoning_efforts: [max, xhigh, high, medium, low, none]
    reasoning_default: {effort: medium}
    cache_mode: implicit
    final_turn_text_only: false
    notes: 'Family representative for gpt-5.6. $2/$10 per M, cache read $0.20, cache write $2.50 on the openai tag (openai/flex half, openai/fast double, azure 2.5x). Efforts incl. `none` from reasoning.supported_efforts; reasoning is NOT mandatory on 5.6, so `none` is legal and the registry keeps its `none` rung. PROBE 2026-09-07 (openai tag, effort medium, 8,158-token prompt with a 415-token screenshot): the live shape (final turn = user[text, image]) DID extend the prefix — A+turn cached 8,155 of 8,158, shortfall 3 tokens — so final_turn_text_only is NOT needed here. This REFUTES carrying the gpt-6-astra image-prefix rule across the OpenAI family: the same script, image, day and endpoint tag reproduced astra''s poisoning (shortfall 439 = the whole screenshot) in the same session, so the behaviour is per MODEL, not per endpoint tag. luna and terra were therefore probed separately rather than copied. Evidence: artifacts/provider-compatibility/cache-hit-probe__openai--gpt-5.6-sol.json.'
  openai/gpt-5.6-luna:
    endpoint: openai
    context_length: 1050000
    max_completion_tokens: 128000
    reasoning_efforts: [max, xhigh, high, medium, low, none]
    reasoning_default: {effort: medium}
    cache_mode: implicit
    final_turn_text_only: false
    notes: 'Cheapest OpenAI endpoint here: $0.20/$1.20 per M, cache read $0.02, cache write $0.25 on the openai tag. Probed individually (not copied) 2026-09-07: live shape cached 8,155 of 8,158, shortfall 3 -> prefix extends through the final-turn image, final_turn_text_only false. Evidence: cache-hit-probe__openai--gpt-5.6-luna.json.'
  openai/gpt-5.6-terra:
    endpoint: openai
    context_length: 1050000
    max_completion_tokens: 128000
    reasoning_efforts: [max, xhigh, high, medium, low, none]
    reasoning_default: {effort: medium}
    cache_mode: implicit
    final_turn_text_only: false
    notes: '$2/$12 per M, cache read $0.20, cache write $2.50 on the openai tag. Probed individually (not copied) 2026-09-07: live shape cached 8,155 of 8,158, shortfall 3 -> prefix extends through the final-turn image, final_turn_text_only false. Evidence: cache-hit-probe__openai--gpt-5.6-terra.json.'

  # Added 2026-09-23 — the GPT-6 Luna/Sol pair (released 2026-09-22). The
  # final_turn_text_only value below is MEASURED per model, not inherited: the
  # gpt-6-astra note above is the standing warning that the image-prefix rule is
  # per MODEL and not per endpoint tag, and these two carry the gpt-6 name while
  # behaving like the gpt-5.6 family.
  openai/gpt-6-luna:
    endpoint: openai
    context_length: 1050000
    max_completion_tokens: 128000
    reasoning_efforts: [max, xhigh, high, medium, low, none]
    reasoning_default: {effort: medium}
    cache_mode: implicit
    final_turn_text_only: false
    notes: 'DISPATCH PROBED 2026-09-23: all six efforts 200 and coherent on a real screenshot, reasoning tokens 516/340/281/218/189/0 down the ladder (monotonic, so the rungs are distinct tiers) at 8.2s down to 2.1s. Reasoning is NOT mandatory on this slug, so the `none` rung is legal and the registry keeps it - unlike gpt-6-astra, same generation, whose mandatory flag is true. CACHE PROBED 2026-09-23 on the openai tag, effort medium, with a real screenshot: the LIVE shape (final turn = user[text, image]) extended the prefix - request A was COLD (9,364 prompt tokens, cached 0, write 9,361) and A+turn cached 9,361 of 11,735, a shortfall of 3 tokens. That is the gpt-5.6 signature, NOT the astra one, so final_turn_text_only is false. CONTROL NOT ESTABLISHED, stated plainly: the same-session gpt-6-astra control did not reproduce its documented poisoning - the first attempt returned a degenerate A+turn (0 prompt tokens, 0 cost) and every retry read a prefix the earlier probes had already warmed (A cached 9,361), while --tail-turns 5 produced a byte-identical 9,364-token prefix instead of a cold one. So the instrument negative-sensitivity check is OUTSTANDING; the luna verdict rests on its own cold-start numbers and on matching the documented shortfall-3 signature exactly. Re-run the astra arm cold before treating this as settled. PRICE: $0.10/$0.50 per M on the openai tag, cache read $0.01, cache write $0.125 - the cheapest OpenAI endpoint here (openai/flex half, openai/fast double). LONG-CONTEXT OVERRIDE above 272,000 prompt tokens: $0.20/$0.75 per M. Evidence: cache-hit-probe__openai--gpt-6-luna.json.'

  openai/gpt-6-sol:
    endpoint: openai
    context_length: 1050000
    max_completion_tokens: 128000
    reasoning_efforts: [max, xhigh, high, medium, low, none]
    reasoning_default: {effort: medium}
    cache_mode: implicit
    final_turn_text_only: false
    notes: 'DISPATCH PROBED 2026-09-23: all six efforts 200 and coherent, reasoning tokens 217/158/120/31/21/0 at 5.7s down to 2.2s - markedly TERSER than gpt-6-luna at every rung, so the flagship is the cheaper thinker here. CACHE PROBED 2026-09-23 separately from luna, not copied from it (per the gpt-5.6-sol precedent that these are probed individually): live shape, request A COLD at 9,364 prompt tokens with cached 0 / write 9,361, then A+turn cached 9,361 of 11,735 - shortfall 3, prefix extends through the final-turn image, so final_turn_text_only false. The SAME control caveat as the luna entry above applies and is not restated: the astra negative control was not re-established this session. PRICE: $2/$10 per M on the openai tag, cache read $0.20, cache write $2.50 (openai/flex half, openai/fast double, azure 1.1x) - 20x luna and half of claude-opus-5.5. LONG-CONTEXT OVERRIDE above 272,000 prompt tokens: $4/$15 per M. Evidence: cache-hit-probe__openai--gpt-6-sol.json.'

  # --- Anthropic Claude -----------------------------------------------------
  # Family representative: claude-opus-5. All four run on the first-party
  # `anthropic` tag with automatic cache_control, so the segment-level cache and
  # replay facts copy; context, output ceiling, prices and the reasoning ladder
  # are each model's own.
  anthropic/claude-opus-5:
    endpoint: anthropic
    context_length: 1000000
    max_completion_tokens: 128000
    # native_json since 2026-09-12 (was prompted). Prompted, the model returned a
    # valid action plus one invented key on 2 of 3 first attempts (`prediction`,
    # then a garbled `"}": null`), each costing a retry. response_format
    # json_schema strict, probed live 3x gameplay + 1x handover with thinking on:
    # every reply validated. The anthropic tag advertises response_format and
    # structured_outputs.
    output_mode: native_json
    # Under strict json_schema the provider closes every object, so the free-form
    # memory dict can only come back as {} — it did on all three compactions of
    # the 14:17 run. As a JSON string it came back with 10 keys (probe 2026-09-12).
    memory_encoding: json_string
    reasoning_efforts: [max, xhigh, high, medium, low]
    reasoning_default: {effort: high}
    cache_mode: automatic
    final_turn_text_only: false
    notes: 'Family representative for Claude 5 on the anthropic tag. Prompted JSON allows flexible memory and avoids forced tool choice with thinking. Replay signed blocks unchanged. $5/$25 per M, cache read $0.50 (90% off), cache write $6.25. Campaign 2026-09-06: automatic caching ran 63->85% within a segment and the growing screenshot conversation cached without any final-turn restriction, so final_turn_text_only stays false.'
  anthropic/claude-sonnet-5:
    endpoint: anthropic
    probed_as: anthropic/claude-opus-5
    context_length: 1000000
    max_completion_tokens: 128000
    output_mode: native_json  # copied from claude-opus-5 (2026-09-12); its tag advertises structured_outputs too
    memory_encoding: json_string  # copied from claude-opus-5: strict schema empties an open memory object
    reasoning_efforts: [max, xhigh, high, medium, low]
    reasoning_default: {effort: high}
    cache_mode: automatic
    final_turn_text_only: false
    notes: 'Copied from claude-opus-5 (same first-party anthropic tag, same automatic top-level cache_control rule, same signed-thinking replay contract); not probed live. Own survey facts: $2/$10 per M, cache read $0.20 (90% off), cache write $2.50, 1M context / 128k output, reasoning optional with efforts max..low (default high). The anthropic tag does NOT advertise temperature/top_p, so no sampling is sent. Registry `thinking_levels` had a `minimal` rung that OpenRouter does not list for this model; it was dropped.'
  anthropic/claude-fable-5.1:
    endpoint: anthropic
    probed_as: anthropic/claude-opus-5
    context_length: 1000000
    max_completion_tokens: 128000
    # STAYS prompted (2026-09-12): with response_format json_schema on the request
    # Anthropic's classifier refuses the turn outright, 3 of 3 probes
    # (finish_reason content_filter, "duplicating model outputs"), even though the
    # tag advertises structured_outputs. The same turn in prompted mode was answered
    # 3 of 3 once the PlayAction class docstring stopped leaking into the schema —
    # that docstring was the cause of its 2026-09-11 turn-1 crash.
    output_mode: prompted
    reasoning_mandatory: true
    reasoning_efforts: [max, xhigh, high, medium, low]
    reasoning_default: {effort: high}
    cache_mode: automatic
    final_turn_text_only: false
    strip_leading_prose: true
    notes: 'Mandatory thinking (catalog reasoning.mandatory true); no tool_choice advertised on ANY of its four endpoints, re-verified 2026-09-07 — hence prompted output. Preserve signed blocks including empty thinking blocks. Cache/replay behaviour copied from claude-opus-5 on the shared anthropic tag. Own survey facts: $10/$50 per M, cache read $0.25 (97.5% off), cache write $12.50. NOTE: OpenRouter serves BOTH anthropic/claude-fable-5 (2026-06-09, cache read $1.00, tool_choice advertised) and anthropic/claude-fable-5.1 (2026-09-01); the registry pointed at 5 and this profile at 5.1, and the registry was moved to 5.1 to match the keep list. 2026-09-12 evening: Anthropic''s classifier refuses Fable''s request when it carries `response_format` (3/3, afternoon) AND when it carries `tools` without tool_choice (3/3, evening probe from the real turn-1 request) — every structured-output form is refused, prompted is the only path. Its prompted JSON pads the object with one null key per attempt (`"inputs_note": null`, `"result": null`, then a trailing comma), so the parser drops null-valued extra keys (src/agent/coerce.py drop_null_extras) and gameplay max_retries is 4. 2026-09-13: with those in place the medium run cleared turns 1-7, then at turn 8 wrote a sentence of prose ("Prediction correct: Oak''s event triggered...") before the object on 5 of 5 attempts (turn 2 attempt 1 too) and crashed; strip_leading_prose is on for this model — the object after the prose was complete every time.'
  anthropic/claude-haiku-4.5:
    endpoint: anthropic
    probed_as: anthropic/claude-opus-5
    context_length: 200000
    max_completion_tokens: 64000
    output_mode: prompted
    # The odd one out. OpenRouter publishes NO reasoning.supported_efforts for this
    # model and none of its eight endpoints advertises `reasoning_effort` — only
    # `reasoning` — so the catalog sanctions no effort name at all. It is listed
    # here anyway, because the ladder was MEASURED to work rather than assumed:
    # 2026-09-07, `anthropic` tag, provider.require_parameters true, one live call
    # per shape -> {effort: minimal} 200, {effort: high} 200, {enabled: true} 200.
    # OpenRouter translates the effort into a thinking budget instead of filtering
    # the endpoint out, so an effort ladder is legal on the wire and the profile
    # must legalise what the registry offers. Whether the ladder is MEANINGFUL is a
    # separate, open question owned by Andreas: models.yaml records n=3 per tier
    # showing high (mean 571 reasoning tokens) separating while medium/low/minimal
    # sit in one 370-480 band and are ordered backwards, and the two calls above
    # returned 33 reasoning tokens at both minimal and high. Those four levels
    # carry real run telemetry, so collapsing them to [thinking, non-thinking]
    # would rewrite four benchmark identities; not done here.
    reasoning_efforts: [high, medium, low, minimal]
    reasoning_default: {effort: high}
    cache_mode: automatic
    final_turn_text_only: false
    notes: 'Cache and replay copied from claude-opus-5 (same first-party anthropic tag, same automatic cache_control) and not probed live: the brief only calls for a cache probe if the endpoint tag differs, and it does not. Own survey facts, and they differ sharply from the rest of the family: 200k context / 64k output (not 1M/128k), $1/$5 per M, cache read $0.10 (90% off), cache write $1.25. Reasoning is optional here (catalog reasoning.mandatory false) and this is the only Anthropic entry with no published effort ladder — see the comment above for what was measured and what stays open.'

  # Added 2026-09-23 — Claude Opus 5.5 (released 2026-09-22). Takes the family
  # copy licensed by the section header above (same first-party `anthropic` tag,
  # same automatic cache_control, same wire contract), declared through
  # `probed_as` rather than silently; its ladder, prices and the mandatory flag
  # are its own.
  anthropic/claude-opus-5.5:
    endpoint: anthropic
    probed_as: anthropic/claude-opus-5
    context_length: 1000000
    max_completion_tokens: 128000
    # CORRECTED 2026-09-23, the same day it was added. This said `native_json` with
    # `memory_encoding: json_string`, both COPIED from claude-opus-5 under probed_as
    # and neither verified on this slug — and the copy is what broke it. Two runs
    # crashed that afternoon with finish_reason content_filter / native_finish_reason
    # refusal, "reverse engineering or duplicating model outputs", on an ordinary
    # Caterpie battle screen.
    # MEASURED on the stored failing request (turn 162 of
    # local/runs/2026-09-23_13-57-01_config-5.1__claude-opus-5-5-low): WITH
    # response_format it is refused 5/5, WITHOUT it answered 5/5; stripping the
    # screenshots instead stays refused 5/5, and every serving tag (anthropic /
    # google-vertex / azure / claude-on-aws / unpinned) refuses 3/3. So it is the
    # strict json_schema — not the endpoint, not the game content.
    # This is the SAME trap already recorded on anthropic/claude-fable-5.1 above
    # ("STAYS prompted (2026-09-12) ... refuses the turn outright ... even though the
    # tag advertises structured_outputs"). Advertising structured_outputs does not
    # mean the classifier tolerates it, and a `probed_as` copy may not carry this
    # field: a Claude profile goes prompted until a probe of THAT slug says otherwise.
    # memory_encoding drops back to the default `object` with it — json_string existed
    # only because a strict schema empties an open memory dict.
    output_mode: prompted
    reasoning_mandatory: true
    reasoning_efforts: [max, xhigh, high, medium, low]
    reasoning_default: {effort: high}
    cache_mode: automatic
    final_turn_text_only: false
    notes: 'DISPATCH PROBED 2026-09-23: all five efforts 200 and coherent on a real screenshot via the unpinned route (served by Claude Platform on AWS; this profile pins the first-party anthropic tag). reasoning_mandatory TRUE is this slug own catalogue value and differs from claude-opus-5, which reports false - so reasoning cannot be disabled here and there is no `none` rung to add. Reasoning tokens 6,880 (max) / 416 / 288 / 497 / 282 are NOT monotonic and are NOT read as a depth signal: Anthropic returns summary tokens only, as the claude-fable-5.1 registry entry records. The first max probe returned an empty reply at a 4,000-token cap - that measured the cap; re-probed at 12,000 it answered in 84.6s. COST: $4/$20 per M, cache read $0.20 (95 percent off), cache write $5.00, identical across the five cheapest of eleven tags; anthropic/fast is double. ONE probe question at max cost $0.1528, the most expensive single probe taken for this registry. COPIED, NOT PROBED HERE (hence probed_as): output_mode native_json, memory_encoding json_string and cache_mode automatic all come from the claude-opus-5 probes of 2026-09-06/2026-09-12. A 5.5-specific cache and structured-output probe is the outstanding follow-up.'

  # --- Google Gemini --------------------------------------------------------
  google/gemini-3.8-flash:
    endpoint: google-ai-studio
    context_length: 1048576
    max_completion_tokens: 65536
    reasoning_mandatory: true
    # `minimal` is NOT in the catalog's supported_efforts for this model but was
    # MEASURED to be a real rung (2026-09-09, scripts/probe_reasoning_floor.py,
    # google-ai-studio tag, require_parameters true, hard prompt x3, 16k ceiling):
    # minimal 1.5k/1.5k/8.5k reasoning tokens vs low 10.5k/11.6k/15.4k vs high
    # 15.4k x3 (hit the ceiling). Thinking OFF is refused: {effort: none} and
    # {enabled: false} both 400 "Reasoning is mandatory for this endpoint".
    # Evidence: artifacts/provider-compatibility/reasoning-floor-compare__google--gemini-3.8-flash.json
    reasoning_efforts: [high, medium, low, minimal]
    reasoning_default: {effort: medium}
    cache_mode: implicit
    final_turn_text_only: false
