    notes: 'PROBED LIVE 2026-09-16 against the cloaked listing stealth/union-alpha, re-pointed 2026-09-18 when the model was announced as unbiased/pareto (same context, same max output, same modality, same advertised parameters; the stealth listing also advertised response_format, which this one does not — inert here, output_mode is tool). REASONING: the endpoint advertises exactly max_tokens/temperature/top_p/tools/tool_choice. Sending a `reasoning` block against the pinned route returns HTTP 404 with routing_funnel failed_routing_step "Filter by Parameters" (arm A); the identical request without it answered 200 with a well-formed gameplay tool call (arm B), as did an unpinned control (arm C). Hence reasoning_default null and reasoning_efforts empty — the registry entry is reasoning_type none, so there is no ladder for the empty list to hide. The replies carry no `reasoning` and report reasoning_tokens 0, so reasoning_replay is inert here and stays at the default `all`. CACHE: implicit — CORRECTED 2026-09-18, it said `none` until then. The 2026-09-16 probe read supports_implicit_caching false off the endpoint metadata and was billed cached_tokens 0, but that probe was one 697-token request, far too small to hit any prefix. The full run of 2026-09-16 is the stronger measurement and says the opposite: 183 responses reporting cached_tokens with cache_write_tokens 0 throughout, 2,411,925 of 3,758,611 prompt tokens read from cache — a 64% read fraction with no markers sent, which is what implicit means. No wire change either way (only `automatic` and `system_breakpoint` touch the request body), so this is the claim being made honest, not a behaviour change. The reveal priced it: the stealth listing served free, unbiased/pareto lists $2.50 prompt / $7.50 completion / $0.25 cache read per M, so the discount those cached tokens earn is now real money. OUTPUT: tools with tool_choice auto; the endpoint supports only `auto` (supports_tool_choice required and function are both