# PokeBench benchmark manifest.
#
# Each benchmark is a SELF-CONTAINED ladder file (configs/checkpoints-firered-*.yaml):
# its own `benchmark:` block — id, name, goal (the meta-goal the agent plays
# toward; overrides the frozen config's task.goal), and `default: true` on exactly
# one — followed by its gate ladder. One YAML = one whole benchmark.
#
# This file only NAMES the ladder files and sets their order (new-run dialog +
# main-page filter). To add a benchmark: author its ladder YAML with a `benchmark:`
# block and list its repo-root-relative path here.

ladders:
  - configs/checkpoints-firered-easy.yaml
  - configs/checkpoints-firered-firstbadge.yaml
  - configs/checkpoints-firered-v1.yaml
