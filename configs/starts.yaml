# The START-STATE registry — the committed savepoints a CASUAL run may begin from.
#
# A ROM's `start_save` in roms.yaml is its ONE default opening. This file adds
# the *choosable* ones, so the same game can be started as a different character
# or from a different moment without inventing a second ROM entry.
#
#   rom          joins to a roms.yaml `id`. The pair (rom, label) is the key.
#   label        what you pass: `--start girl`. Scoped to the rom, so two games
#                may both offer a `girl` without colliding.
#   name         display string for the picker.
#   path         a committed savepoint dir — emulator.state + state.json +
#                tasks.json, exactly like a run savepoint, so the executor
#                resumes it through the same code path as a continue.
#   default      the option the CLI help and the new-run dialog PRESELECT. At most
#                one per rom. It is deliberately NOT what the executor falls back
#                to: a run with no --start keeps the exact pre-registry behaviour
#                (executor.CANONICAL_SAVE for the default rom, else the rom's own
#                start_save), so nothing about existing runs moved when this file
#                appeared. See RunExecutor._resolve_start.
#
# Official runs IGNORE this file entirely: a benchmark starts from
# executor.CANONICAL_SAVE, because a frozen benchmark cannot have a choosable
# opening and still be comparable across runs.
#
# `configs/saves/*/emulator.state` files ARE committed (unlike `roms/`), so these
# resolve on a fresh clone.

starts:
  - rom: firered
    label: boy
    name: "Red (boy)"
    default: true
    # The long-standing FireRed opening: standing in the bedroom before the game
    # has asked for a name.
    #
    # It pointed at configs/saves/pokebench-v1 — deliberately the SAME directory
    # as executor.CANONICAL_SAVE, so the casual boy start and the scored
    # benchmark start could never drift apart. That reasoning was written for
    # mGBA and it does not survive the backend change: pokebench-v1's
    # emulator.state is an mGBA state and SkyEmu answers /load -> failed on it
    # (src/emulator/backends/skyemu.py:837 names this exact file). So every
    # casual FireRed run on this backend died before its first turn, which is
    # not two starts drifting apart — it is one of them not existing.
    #
    # This is the SkyEmu capture of the same scene, made by
    # v2-experiments/make_start_states.py, and it is already what
    # configs/config-6.0.yaml loads as its snapshot. The invariant the old
    # comment wanted now lives where it can hold: FireRed's roms.yaml
    # `start_save` names this same directory, exactly as the other six games do.
    path: "configs/saves/skyemu/firered-pokebench-v2"
    description: "Bedroom, start of game. Same savepoint the benchmark scores from."

  - rom: firered
    label: girl
    name: "Leaf (girl)"
    # Captured 2026-08-03 from Andreas's own playthrough, at the same point as the
    # boy start (bedroom, pre-naming) so the two are interchangeable openings and
    # not different amounts of progress. Its tasks.json is copied from the boy
    # start for exactly that reason.
    path: "configs/saves/firered-girl"
    description: "Bedroom, start of game, playing as Leaf. Visually distinct from the boy start — useful when filming two runs side by side."

  # ─────────────────────────────────────────────────────────────────────────
  # Added 2026-09-19 with the six non-FireRed games. One entry each, so the
  # picker and `pokemon ls starts` have a NAME and a description for every
  # game rather than an unlabelled fallthrough to the ROM's own `start_save`.
  #
  # Each points at the same directory the ROM's `start_save` does — deliberately
  # the same file, exactly as FireRed's `boy` shares a directory with
  # executor.CANONICAL_SAVE, so the named opening and the default opening cannot
  # drift apart.
  #
  # `default: true` here means only "the option the picker preselects".
  # RunExecutor._resolve_start does NOT consult it: a run that names no start
  # keeps the pre-registry behaviour (the ROM's own start_save), which is the
  # same directory anyway.
  #
  # Every one of these was REPLAYED headless from a measured input sequence, not
  # converted from an mGBA state — SkyEmu refuses those. The check each passed:
  # from the saved state, all four d-pad directions change the screen against an
  # IDLE control of the same length. See configs/saves/skyemu/README.md.
  # ─────────────────────────────────────────────────────────────────────────

  - rom: emerald
    label: truck
    name: "The moving van"
    default: true
    path: "configs/saves/skyemu/emerald"
    description: "In the back of the moving van arriving in Littleroot Town, before the game has asked for a name. Five tiles wide with boxes on three sides — it is the one start of the seven that cannot be used to measure movement."

  - rom: crystal
    label: bedroom
    name: "Bedroom, New Bark Town"
    default: true
    path: "configs/saves/skyemu/crystal"
    description: "Upstairs at home in New Bark Town, playing as Chris. Crystal has a real-time clock and the state carries the host's time of day with it, which Gen 2 gates encounters on."

  - rom: platinum
    label: bedroom
    name: "Bedroom, Twinleaf Town"
    default: true
    path: "configs/saves/skyemu/platinum"
    description: "Upstairs at home in Twinleaf Town, playing as Todd. The rival is named Barry by default."

  - rom: soulsilver
    label: bedroom
    name: "Bedroom, New Bark Town"
    default: true
    path: "configs/saves/skyemu/soulsilver"
    description: "Upstairs at home in New Bark Town, playing as AA. SoulSilver rolls a RANDOM name suggestion rather than offering a default, so the opening types a name instead of accepting one."

  - rom: black
    label: bedroom
    name: "Bedroom, Nuvema Town"
    default: true
    path: "configs/saves/skyemu/black"
    description: "In the bedroom between Cheren and Bianca, playing as A. The three starters are in the gift box in this room, so the first goal of the game needs no door."

  - rom: black2
    label: room
    name: "The player's room, Aspertia City"
    default: true
    path: "configs/saves/skyemu/black2"
    description: "Playing as Ace. The one game of the seven that does not open in a bedroom — Black 2 opens on a street where Mom takes a call, and the room is reached without walking through a door."
