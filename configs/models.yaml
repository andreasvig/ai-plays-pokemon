# context windows, modalities, prices and release dates come from OpenRouter's
# /api/v1/models and /api/v1/models/<slug>/endpoints, fetched 2026-09-22, and
# every (model, level) pair was dispatched live the same day through
# scripts/probe_registry_candidates.py — a real FireRed screenshot plus the
# pathfinding prompt, so a 200 there means the level is SERVED and the model
# read the image, not just that the catalogue advertises it. The candidate rows
# are in that script, so the probe is repeatable.
