  # tokens), so this is per-model, not a Kimi-family rule.
  thinking_levels:
  - thinking
  temperature: 0.3
  top_p: 0.95
  provider:
    ignore:
    - moonshotai/highspeed
  slow:
    thinking: true
  observed:
    thinking:
      avg_turn_cost_usd: 0.0072
      avg_turn_latency_s: 6.5
      sample_turns: 19
      last_updated: 2026-08-02
      notes: 'Backfilled from the 2026-06-17 run (19 turns, config-3.13); telemetry had never been recorded. Not slow in practice despite the defensive slow flag. Thinking is ADAPTIVE on this model: reasoning appeared on only 2 of 19 turns (response_tokens 109-237 on the quiet ones, 1381 and 1009 on the two that thought) and both thinking turns were the ones diagnosing a move that had failed. Chased twice as a defect on 2026-08-02 and it is neither: forced tool_choice does NOT suppress it (text arm 1237 vs tool arm 922 reasoning tokens) and neither does provider routing (all 10 pinned providers returned reasoning). Do not re-open it.'

