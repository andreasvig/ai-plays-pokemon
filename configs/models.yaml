# Moonshot Kimi K2.7 Code (added 2026-06-17) — binary thinking, multimodal (text+image, OpenRouter API 2026-06-17), 262K ctx. Providers support tool_choice + structured_outputs → default tool output. Pricing: $0.74/$3.50 cheapest (DeepInfra); Moonshot's own first-party endpoint has TWO tiers — standard `moonshotai/int4` ($0.95/$4.00) and `moonshotai/highspeed` ($1.90/$8.00). The Highspeed tier is EXCLUDED via provider.ignore per Andreas (2026-06-17), so routing falls to the standard/cheaper endpoints. slow:thinking defensive — the Kimi line's reasoning grows with history (K2.6 was the slowest in registry, 110-458s/turn); drop the flag if a first run shows a fast tail. Sampling 0.3/0.95. Floating slug (pinned: moonshotai/kimi-k2.7-code-20260612).
kimi-k2.7-code:
  openrouter_id: moonshotai/kimi-k2.7-code
  reasoning_type: binary
  # `non-thinking` REMOVED 2026-08-02: it is not a level this model has.
  # `reasoning: {enabled: false}` returns HTTP 400 "Reasoning is mandatory for
  # this endpoint and cannot be disabled" — and OpenRouter reported the same
  # 400 from all 15 endpoints it tried before giving up, so no routing or
  # fallback recovers it. Leaving it listed meant the picker offered a level
  # that could only ever produce a dead run. Sibling kimi-k2.6 is NOT affected
