  # actual game progress.** Final state.json: in Oak's Lab, Pallet Town,
  # with Charmander as starter, with `pallet_town` mapped. The agent
  # actually left the house, walked to Oak, and got the starter — none
  # of the other 2026-05-01 runs cleared step 1 of the task.
  #
  # Self-grade rate (9/20 = 45%) is misleadingly low compared to
  # GPT-5.5(medium)'s 70% — the difference is that Pro made ambitious
  # predictions ("I'll be in Oak's Lab") and sometimes missed, vs
  # GPT-5.5 making conservative predictions and trivially matching.
  # Game state is the real benchmark (see project memory:
  # feedback_pokemon-success-metric).
  #
  # Cost ($0.0191/turn) is 21% higher than (low)'s $0.0158, latency
  # 11.0s (matches low's 11.4s), output 755 tokens/turn (vs 553 on
  # GPT-5.5 medium — Pro reasons more verbosely). Total run: $0.38 / 20T.
  #
  # Recommended next: 50T run to see how far Pro(medium) progresses
  # past Oak's lab. (low)'s 50T sample reached "back in Pallet Town
  # overworld by T46 with Squirtle leveled to 6" — medium should do
  # at least as well.
  openrouter_id: "google/gemini-3.1-pro-preview"
  reasoning:
    effort: "medium"
  observed:
    avg_turn_cost_usd: 0.0191
    avg_turn_latency_s: 11.0
    sample_turns: 20
    last_updated: 2026-05-01
    notes: "Reached Oak's Lab + got Charmander starter at T20. Best in-game progress of any 2026-05-01 run. Lower self-grade rate (45%) than GPT-5.5(medium)'s 70% but actually played the game while GPT-5.5 stayed in the house."

