# ============================================================================
# Model Registry
# ============================================================================
# Central registry for LLM aliases. Each entry defines the OpenRouter model ID
# plus any per-model settings (reasoning, sampling, fallbacks) and observed
# empirical performance data from actual runs.
#
# Usage in config-X.Y.yaml:
#     llm_model: "gemini-3-flash(high)"   # alias — resolved from this file
# or
#     llm_model: "google/gemini-3-flash-preview"   # raw OpenRouter ID — bypasses registry
#
# Scope: LLM only. vlm_model and ocr.cleanup_model still read raw IDs directly.
#
# Entry schema (all fields optional except openrouter_id):
#     openrouter_id:  exact slug (verify on openrouter.ai)
#     reasoning:      OpenRouter reasoning param. Shape varies by model family:
#                       - Effort-tiered (OpenAI, Gemini 3, Grok): {effort: "high"|"medium"|"low"|"minimal"}
#                       - Binary-thinking (MiMo V2.5, Gemma 4): {enabled: true|false}
#                       Omit entirely to leave reasoning unset (model's default wins).
#     temperature:    float, OpenAI-compatible sampling temperature
#     top_p:          float, nucleus sampling cutoff
#     max_tokens:     int, completion token budget
#     fallbacks:      list of alias names to try if primary fails
#     output_mode:    Pydantic AI structured-output strategy. Optional, defaults
#                     to "tool" (tool_choice="required" — strongest schema
#                     enforcement, broadest support). Override to "native_json"
#                     for models whose OpenRouter providers don't expose
#                     tool_choice but do support response_format json_schema
#                     (e.g. qwen/qwen3.6-plus). "prompted" is text+parse
#                     last-resort for models without either.
#     observed:       empirical performance from actual runs
#                       avg_turn_cost_usd: float (total run cost / turns)
#                       avg_turn_latency_s: float (wall-clock seconds per turn)
#                       sample_turns:      int (0 = untested)
#                       last_updated:      YYYY-MM-DD
# ============================================================================

# --- Google Gemini 3 family (native effort tiers: high/medium/low/minimal) ---
# OpenRouter maps reasoning.effort directly to Google's thinkingLevel.
# No sampling overrides — let Gemini use its own tuned defaults.
"gemini-3-flash(high)":
  # $0.50/$3.00 per M, 1M context.
  openrouter_id: "google/gemini-3-flash-preview"
  reasoning:
    effort: "high"
  observed:
    avg_turn_cost_usd: 0.0090
    avg_turn_latency_s: 27.0
    sample_turns: 20
    last_updated: 2026-04-24

"gemini-3-flash(medium)":
  openrouter_id: "google/gemini-3-flash-preview"
  reasoning:
    effort: "medium"
  observed:
    sample_turns: 0

"gemini-3-flash(low)":
  # Observed (2026-04-25, 10T verification run after the prompted-output
  # architecture work). Cheapest + fastest of any Flash variant: $0.0031/turn,
  # 3.7s/turn LLM latency, zero retries. 10T sample is small — latency may
  # vary in scenes with battles/dialogue. Used to verify tool-mode path
  # still works after registry-driven output_mode + robust JSON extractor
  # changes; passed cleanly with no regressions.
  openrouter_id: "google/gemini-3-flash-preview"
  reasoning:
    effort: "low"
  observed:
    avg_turn_cost_usd: 0.0031
    avg_turn_latency_s: 3.7
    sample_turns: 10
    last_updated: 2026-04-25

"gemini-3-flash(minimal)":
