# --- Anthropic Claude Haiku 4.5 (added 2026-05-20) ---
# First Anthropic entry in this registry. Marketed as "near-frontier
# intelligence at a fraction of the cost" — $1.00/$5.00 per M, 200K
# context (smaller than Gemini's 1M but plenty for ~10K system prompt +
# ~5K turn input), multimodal (text + image — required for our default
# vision_mode: direct_multimodal).
#
# Reasoning shape: effort-tiered on OpenRouter (xhigh/high/medium/low/
# minimal), same convention as the Gemini 3 family. Backed by
# Anthropic's extended_thinking budget under the hood — OpenRouter
# translates effort tier to max_tokens ratio: 0.95/0.8/0.5/0.2/0.1
# of completion budget for xhigh/high/medium/low/minimal. To disable
# thinking entirely, OpenRouter convention is `reasoning.effort: "none"`
# (NOT the `enabled: false` shape used by MiMo/Gemma/Qwen/Perceptron).
# Minimum thinking budget is 1024 tokens when extended thinking is on.
#
# Known agent-loop quirks (researched 2026-05-20, sources in CHANGELOG):
#   1. **Repetitive-loop failure mode**: Haiku 4.5 can stall in an
#      agent loop by re-calling the same tool/action even after the
#      tool's output indicates the action already succeeded — model
#      fails to update its plan from tool feedback. Risk for this
#      project: our turn loop calls a structured-output tool every
#      turn (GameAction). If Haiku misreads "screen settled, next turn"
#      feedback, it may re-emit identical button sequences. Watch for
#      this in the first 10-20T; abort and try a higher effort tier
#      or stricter prompt if the agent gets stuck pressing the same
#      input repeatedly without progress.
#   2. **Last-turn-only thinking blocks**: All Haiku models through
#      4.5 only preserve thinking blocks from the LAST turn (vs Sonnet
#      and Opus which preserve all prior thinking). Affects multi-step
#      reasoning continuity — earlier turns' "why I chose this plan"
#      reasoning evaporates from context. Less of a concern for us
#      since our `previous turns` section carries reasoning prose
#      forward explicitly, but worth knowing.
#   3. **"Stubborn" in long sessions**: anecdotal reports of less
#      responsive behavior and shorter-than-expected outputs as the
#      session grows. For a 50T+ run this is worth monitoring.
#   4. **Prompt size limits**: real-world MCP setups can blow Haiku's
#      effective prompt limit (200K hard cap but practical limits lower
#      with heavy tool surface area). NOT a concern for this project —
#      single output schema, ~10K system prompt.
#
# Sampling: leaving unset (Anthropic's tuned defaults), matching the
# Gemini family convention.
#
# output_mode REQUIREMENT: must be "prompted" for all Haiku entries.
# Anthropic explicitly rejects extended thinking when tool_choice forces
# tool use ("Thinking may not be enabled when tool_choice forces tool
# use" — Pydantic AI issues #2425, #3092). The project's default
# output_mode "tool" sets tool_choice="required" for schema enforcement,
# which silently strips reasoning on OpenRouter routes to Anthropic
# (verified 2026-05-20 — 10T probe completed at $0.108 with zero
# thinking tokens billed and zero [Thinking] lines in the output).
# "prompted" bypasses tool_choice entirely (schema in system prompt +
# client-side JSON parse), same workaround already used for Qwen3.6-Plus
# and Perceptron Mk1. Native JSON (response_format json_schema) would
# also work in principle but Pydantic AI rejects it client-side without
# a model-profile declaration of supports_json_schema_output.
"claude-haiku-4.5(high)":
  openrouter_id: "anthropic/claude-haiku-4.5"
  reasoning:
    effort: "high"
  output_mode: "prompted"
  observed:
    sample_turns: 0

"claude-haiku-4.5(medium)":
  # Observed (2026-05-20, 10T probe on config-3.3): thinking confirmed
