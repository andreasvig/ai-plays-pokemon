# Google Gemini 3.6 Flash (released 2026-07-21) — effort-tiered, multimodal (text/image/video/audio), 1M ctx, $1.50/$7.50 per M. Default tool output mode (tool_choice + structured_outputs both advertised), same as every other Gemini entry here. Probed 2026-07-30: 200, read the screenshot, solved the spatial task; high/medium/low/minimal all accepted. `minimal` returned 0 reasoning tokens at BOTH probe budgets (700 and 2500 max_tokens) — that is a clean signal, so minimal genuinely turns thinking off. Ladder capped at high to match the rest of the Gemini family: max/xhigh also return 200, but Google's native ladder does not go that high, so they are very likely clamped onto high and would duplicate it as a benchmark identity. CONFIRMED 2026-08-02 — that "very likely" is now documented fact: Google's thinking docs list this model's levels as exactly minimal/low/medium/high, with no max or xhigh anywhere in the Gemini 3 family. Latency 1.5-14.8s, cost $0.008-0.020/call — but those came from a CAPPED probe and are floors, not ceilings; see the uncapped gemini-3.5-flash numbers for what an uncapped reasoning-heavy call actually costs on a flash model. This entry has NOT been re-measured uncapped.
# Anthropic Claude Haiku 4.5 — effort-tiered (high/medium/low/minimal) on Anthropic extended_thinking budget. 200K ctx, $1.00/$5.00 per M, multimodal. output_mode prompted REQUIRED: tool_choice=required silently strips extended thinking on Anthropic routes (verified 2026-05-20, re-confirmed 2026-08-02 on claude-sonnet-5 — text arm 100 reasoning tokens, forced-tool arm 0).
# TIER WARNING (measured 2026-08-02, n=3 per tier, all served by Amazon Bedrock):
#   high    640/559/513  mean 571
#   medium  374/392/367  mean 378
#   low     421/395/421  mean 412
#   minimal 455/480/375  mean 437
# Only `high` separates. medium/low/minimal sit in one 370-480 band AND are
# ordered BACKWARDS against the "thinking_levels HIGHEST FIRST" contract at the
# top of this file — medium is the lowest of the three. Within-tier spread is
# small, so the inversion is not noise. This is also the only Anthropic entry
# whose OpenRouter endpoint advertises `reasoning` but NOT `reasoning_effort`,
# which is consistent with the sub-high tiers being collapsed upstream.
# Consequence: benchmarking haiku(medium) vs haiku(low) vs haiku(minimal)
# produces three leaderboard identities that differ only by noise. NOT changed
# here — dropping a level rewrites benchmark identity, so it is Andreas's call.
claude-haiku-4.5:
  openrouter_id: anthropic/claude-haiku-4.5
  reasoning_type: effort
  thinking_levels:
  - high
  - medium
  - low
  - minimal
  output_mode: prompted
  observed:
    high:
      sample_turns: 0
    medium:
      avg_turn_cost_usd: 0.0303
      avg_turn_latency_s: 43.0
      sample_turns: 10
      last_updated: 2026-05-20
      notes: Stuck on 2F Player's house — never reached 1F. 0/9/1 grades. Thinking confirmed active (5038 output tokens/turn, 6.1× the broken tool-mode run). 0 prompted-output retries (cleanest JSON of any prompted-mode model in registry). Same spatial-grounding failure mode as Flash Lite high / Grok 4.3 / GPT-5.5 medium / Perceptron Mk1. config-3.3.
    low:
      sample_turns: 0
    minimal:
      sample_turns: 0
# Anthropic Claude Sonnet 4.6 — effort-tiered, 200K ctx, frontier (~3x Haiku/token), multimodal. output_mode prompted REQUIRED (same Anthropic tool_choice/thinking constraint). Preserves prior-turn thinking (unlike Haiku). Most honest self-grader in the bedroom-stuck cluster but most expensive.
