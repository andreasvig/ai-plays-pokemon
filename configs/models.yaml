# --- Xiaomi MiMo V2.5 family ---
# Closed dense reasoning models, 1M context. Binary thinking toggle only —
# no effort tiers exist in Xiaomi's native API (confirmed from
# platform.xiaomimimo.com docs, 2026-04-24). thinking defaults to enabled
# server-side; setting it explicitly makes the behaviour obvious in logs.
#
# Sampling: temperature 0.3 + top_p 0.95 is Xiaomi's own "Function Call"
# recommendation for mimo-v2-flash. Our agent produces structured
# Pydantic-validated GameAction output, which is the same shape, so we
# apply the low-temp Function Call profile rather than the v2.5 blanket
# general-purpose recommendation (1.0 / 0.95).
"mimo-v2.5(thinking)":
  # ~1T total params, AA Intelligence ~54, $0.40/$2.00 per M.
  openrouter_id: "xiaomi/mimo-v2.5"
  reasoning:
    enabled: true
  temperature: 0.3
  top_p: 0.95
  observed:
    avg_turn_cost_usd: 0.0035
    avg_turn_latency_s: 58.6
    sample_turns: 3
    last_updated: 2026-04-24

# mimo-v2.5(non-thinking) sample is from a 10-turn run aborted at turn 8.
# Quality was observably poor on spatial tasks: every turn emitted a single
# direction at max input length with no directional combination or correction.
# The numbers below are honest but the agent was not functional.
"mimo-v2.5(non-thinking)":
  openrouter_id: "xiaomi/mimo-v2.5"
  reasoning:
    enabled: false
  temperature: 0.3
  top_p: 0.95
  observed:
    avg_turn_cost_usd: 0.0011
    avg_turn_latency_s: 11.9
    sample_turns: 8
    last_updated: 2026-04-24

# mimo-v2.5-pro is TEXT-ONLY on OpenRouter — no endpoints support image
# input (confirmed 2026-04-24 via 404 "No endpoints found that support
# image input"). Incompatible with our default vision_mode: direct_multimodal
# which sends screenshots as ImageUrl. To use Pro in this project, switch
# the config to vision_mode: separate_vlm (vision model captions screens
# to text first). Leaving both entries in the registry so the cost/intel
# numbers stay documented, but don't expect them to work in config 2.2+
# without a vision-mode change.
"mimo-v2.5-pro(thinking)":
  # Flagship tier, $1.00/$3.00 per M (~2.5× mimo-v2.5 base). TEXT-ONLY.
  openrouter_id: "xiaomi/mimo-v2.5-pro"
  reasoning:
    enabled: true
  temperature: 0.3
  top_p: 0.95
  observed:
    sample_turns: 0
    incompatible: "text-only — no image input (OpenRouter 404 on vision_mode: direct_multimodal)"

"mimo-v2.5-pro(non-thinking)":
  # TEXT-ONLY, same caveat as thinking variant.
  openrouter_id: "xiaomi/mimo-v2.5-pro"
  reasoning:
    enabled: false
  temperature: 0.3
  top_p: 0.95
  observed:
    sample_turns: 0
    incompatible: "text-only — no image input (OpenRouter 404 on vision_mode: direct_multimodal)"

