# ============================================================================
# Model Registry (collapsed schema — Andreas 2026-06-17)
# ============================================================================
# ONE record per model. The thinking level is a SECOND axis: pick a model, then
# a level. Run identity stays "model(level)" (e.g. gpt-5.5(high)) so each level
# still benchmarks SEPARATELY on the leaderboard. config.py reconstructs the
# per-(model,level) settings at resolve time.
#
# Schema (all optional except openrouter_id + reasoning_type):
#   openrouter_id:    exact slug (floating alias ok; verify on openrouter.ai)
#   reasoning_type:   effort | binary | none
#                       effort  -> reasoning {effort: <level>}  (+ summary if set)
#                       binary  -> reasoning {enabled: level=='thinking'}
#                       none    -> no reasoning sent (always-on / not configurable)
#   thinking_levels:  ordered list, HIGHEST FIRST. [0] is the picker default.
#                       effort: xhigh/high/medium/low/minimal (or a subset)
#                       binary: [thinking, non-thinking].  none: omit.
#   reasoning_summary: 'auto' to reliably surface OpenAI reasoning summaries.
#   output_mode:      tool (default) | native_json | prompted.
#   temperature/top_p/max_tokens/provider/fallbacks: model-wide passthrough.
#   slow:             true (all levels) | {level: true} — doubles per-attempt
#                     LLM timeouts (known-slow end-to-end latency).
#   observed:         {level: {avg_turn_cost_usd, avg_turn_latency_s,
#                     sample_turns, last_updated, notes}} — per-level telemetry.
# ============================================================================

