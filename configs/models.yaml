# ============================================================================
# Model Registry (collapsed schema — Andreas 2026-06-17)
# ============================================================================
# ONE record per model. The thinking level is a SECOND axis: pick a model, then
# a level. Run identity stays "model(level)" (e.g. gpt-5.5(high)) so each level
# still benchmarks SEPARATELY on the leaderboard. config.py reconstructs the
# per-(model,level) settings at resolve time.
#
# Schema (all optional except openrouter_id + reasoning_type):
#   openrouter_id:    exact slug (floating alias ok; verify on openrouter.ai)
#   reasoning_type:   effort | binary | none
#                       effort  -> reasoning {effort: <level>}  (+ summary if set)
#                       binary  -> reasoning {enabled: level=='thinking'}
#                       none    -> no reasoning sent (always-on / not configurable)
#   thinking_levels:  ordered list, HIGHEST FIRST. [0] is the picker default.
#                       effort: xhigh/high/medium/low/minimal (or a subset)
#                       binary: [thinking, non-thinking].  none: omit.
#   reasoning_summary: 'auto' to reliably surface OpenAI reasoning summaries.
#   output_mode:      tool (default) | native_json | prompted.
#   temperature/top_p/max_tokens/provider/fallbacks: model-wide passthrough.
#   multimodal:       false to mark a text-only model (default true). The Player
#                     plays from screenshots, so the picker only offers multimodal
#                     models for the Player; every current entry is vision-capable.
#   slow:             true (all levels) | {level: true} — doubles per-attempt
#                     LLM timeouts (known-slow end-to-end latency).
#   observed:         {level: {avg_turn_cost_usd, avg_turn_latency_s,
#                     sample_turns, last_updated, notes}} — per-level telemetry.
#   retired:          true on an entry kept ONLY so an alias hard-coded in code or
#                     in a frozen config still resolves. It exists for the legacy
#                     path and for the telemetry already attached to it, and it is
#                     hidden from the model picker (the filter lives in
#                     src/app/catalog.py:list_models, and /api/models + /api/profiles
#                     both honour it — the flag is NOT read by src/config.py, so an
#                     old run's model stays resolvable). A retired entry has no
#                     provider profile, but that no longer stops it running on
#                     config-5.0: since the 2026-09-07 D2 decision the profile
#                     `defaults:` block applies to every model, so it runs UNPROFILED
#                     — everything except a pinned endpoint. Never add one for
#                     convenience: the only reason to retire rather than remove is
#                     that removing breaks a caller.
# ============================================================================
# ----------------------------------------------------------------------------
# PRUNED 2026-09-07 to the keep list Andreas chose when config-5.0 (the append
# harness) became the standard for casual AND official runs: newest version per
# family, every remaining model profiled in configs/provider-profiles.yaml. 43
# entries became 21 (26 removed, 5 added, 1 retargeted).
#
# Removing an entry does NOT touch the runs already on disk. Nothing on the read
# path resolves a run's model against this file: src/app/projection.py:114 takes
# the model name straight from run_summary.json (`session.llm_alias` or
# `session.llm_model`, else "unknown"), and src/app/catalog.py:list_models()
# only ITERATES this registry to build picker rows. So a removed model keeps its
# History rows, its leaderboard row and its report; it just stops being
# startable. The consumers that DO resolve against the registry are all on the
# start-a-run path: src/cli/runner.py (resolve_model_selection),
# src/dashboard/server.py:681-689 (queue validation) and
# src/app/executor.py:261-267 — that last one means a casual CONTINUE with a
# model swap onto a removed model now fails validation, which is the intent.
#
# Removed (24): gemini-3-flash, gemini-3.1-flash-lite, gemini-3.1-pro,
# gemini-3.6-flash, gemma-4-26b-a4b, qwen3.6-plus, qwen3.7-flash, grok-4.3,
# grok-4.5, grok-build-0.1, gpt-5.5, gpt-5.5-pro, gpt-5.4-mini, gpt-5.4-nano,
# gpt-5.6-luna-pro, gpt-5.6-sol-pro, gpt-5.6-terra-pro, kimi-k2.6,
# kimi-k2.7-code, perceptron-mk1, claude-sonnet-4.6, claude-opus-4.8, inkling,
# step-3.7-flash.
#
# RETIRED, not removed (2): gemini-3.5-flash and claude-opus-4.7. Both are named
# by a hard-coded alias in code that is still on the legacy path, and
# resolve_model_selection exits the process on an unknown one, so removing them
# turned ~20 tests red and would have broken the callers in production too:
#   src/cli/runner.py:414  DEFAULT_FREEPLAY_TASK_MASTER_MODEL =
#     "gemini-3.5-flash(medium)" — the TaskMaster every freeplay run gets when
#     neither task_master.model nor --task-master-model is set.
#   src/cli/app.py:285  prepare_config(None, "claude-opus-4.7(medium)") — the
#     control-center supervisor's placeholder alias; it never runs the agent, but
#     prepare_config binds a model, so booting the supervisor needs it to resolve.
# They carry `retired: true`, no provider profile, and real telemetry (gemini
# medium n=50, minimal n=20; opus-4.7 xhigh n=20, medium n=10). Nothing else in
# configs/ or src/ names a removed alias as a VALUE — every other hit is a
# comment, a docstring, a CLI help example or frontend mock data, and the
# `cleanup_model` / `search_model` keys in the frozen configs are raw OpenRouter
# ids, which bypass the registry entirely. The stale help examples are listed in
# the handover for whoever owns those files.
#
# gemini-3.1-pro is dropped WITHOUT a replacement, and that is a finding rather
# than an omission: OpenRouter has no Gemini Pro newer than
# google/gemini-3.1-pro-preview (created 2026-02-19). Everything Google has
# shipped since is a Flash or Flash-Lite (3.5, 3.6, 3.7, 3.8) or an image model.
# So the registry now has no Gemini Pro tier at all, and the two PHANTOM rungs
# the old entry warned about (`medium`, `minimal`, which Google's thinking docs
# do not give the Pro tier) never got resolved — they left with the entry. The
# floating alias `~google/gemini-pro-latest` exists but still resolves within
# the 3.1 line. Re-add a Pro when Google ships one.
#
# After this prune, the leaderboard-visible identity count is one per
# (model, level). See list_competitor_aliases() in src/config.py.
# ----------------------------------------------------------------------------
# Anthropic Claude Opus 5 (released 2026-07-24) — Anthropic's current Opus tier, effort-tiered, multimodal, 1M ctx, $5/$25 per M (same rate card as opus-4.8/4.7). output_mode prompted REQUIRED (forced tool_choice suppresses thinking on every Anthropic model — the standard carve-out, same as opus-4.8/sonnet-5). Probed 2026-07-30 on a real FireRed screenshot: 200 via Amazon Bedrock, read the screen and solved the spatial task at every tier. Tiers max/xhigh/high/medium/low all accepted; reasoning-token counts are SMALL (70-111) because Anthropic never returns the raw chain of thought — those are summary tokens, so do NOT read them as thinking depth the way you would a Gemini count. `minimal` also returns 200 but is deliberately OMITTED below: Anthropic's own ladder for this model is low..max (five tiers, no minimal), so OpenRouter is translating it — probably clamping to low — and including it would create a second benchmark identity that secretly duplicates low. Cost ~$0.024-0.027/call on the probe prompt; latency 5.6-11.8s (not slow-flagged). NOTE for a future run: on this model thinking is ON by default and disabling it is only legal at effort <= high — irrelevant while we always send an explicit effort, but it bites anyone who adds a no-thinking path.
claude-opus-5:
  openrouter_id: anthropic/claude-opus-5
  reasoning_type: effort
  thinking_levels:
  - max
  - xhigh
  - high
  - medium
  - low
  output_mode: prompted
  observed:
    max:
      sample_turns: 0
    xhigh:
      sample_turns: 0
    high:
      sample_turns: 0
    medium:
      sample_turns: 0
    low:
      sample_turns: 0
# Anthropic Claude Fable 5 (released 2026-06-09) — Anthropic's most capable widely-released model, effort-tiered, multimodal, 1M ctx, $10/$50 per M (2x Opus 5, the priciest entry in this registry). output_mode prompted REQUIRED (same Anthropic thinking-vs-tool_choice carve-out). Probed 2026-07-30: 200 via Amazon Bedrock, read the screenshot and solved the spatial task at every tier; max/xhigh/high/medium/low all accepted. Reasoning tokens 36-119 = summary tokens only (raw chain of thought is never returned on this model), not a depth signal. `minimal` returns 200 but is omitted for the same reason as opus-5 (not a native Anthropic tier; likely clamped). COST WARNING: $0.069/call at max and $0.040 at high on a single short probe prompt — a 50-turn run at max would land in the $3-4 range before OCR, several times any other entry here, so treat it as a deliberate ceiling-test model rather than a routine benchmark pick. Thinking is ALWAYS on for this model (Anthropic rejects an explicit disable), which is fine here since the harness never disables it.
# Anthropic Claude Sonnet 5 (added 2026-07-01) — effort-tiered, multimodal, 200K ctx. output_mode prompted REQUIRED. Probed 2026-07-01 (text+image, real FireRed screenshot): resolves 200 on OpenRouter, reads the screen accurately (identified the L5 Squirtle vs L5 Charmander battle + menu). reasoning_type effort CONFIRMED — {effort:high} on a reasoning-heavy prompt produced reasoning_tokens (adaptive: a trivial prompt produced 0, so thinking scales to need). Forced tool_choice SUPPRESSES thinking (reasoning_tokens→0 with a tool budget set) — the standard Anthropic thinking-vs-tool_choice constraint, hence prompted output (same as sonnet-4.6/opus-4.7/4.8). Reasoning ladder VERIFIED MONOTONIC via probe (harder prompt, max_tokens 4000): effort=max→621 reasoning tokens > xhigh→508 > high→298 — 'max' is a GENUINE top tier here, NOT a clamp: OpenRouter accepts {effort:max} for this Anthropic model with HTTP 200 (unlike older registry models where 'max'→HTTP 400; either OpenRouter changed or it's Anthropic-specific). max/xhigh cost ~$0.04/call at 4000-tok cap vs high ~$0.019; latency 25-52s at the top tiers vs 3-12s at high and below (still no persistent slow tail → no slow flag, but the max tier is the pricey/slow end). No real pokemon run yet → sample_turns 0.
claude-sonnet-5:
  openrouter_id: anthropic/claude-sonnet-5
  reasoning_type: effort
  # `minimal` dropped 2026-09-07: OpenRouter's catalog enumerates this model's
  # reasoning.supported_efforts as exactly max/xhigh/high/medium/low, and the
  # claude-opus-5 entry below already records WHY a Claude `minimal` is a trap —
  # it returns 200 but Anthropic's own ladder is low..max, so OpenRouter clamps it
  # and it becomes a second benchmark identity that secretly duplicates low. opus-5
  # omitted it deliberately for that reason; sonnet-5 kept it by oversight. Its
  # `observed` row had sample_turns 0, so no measurement is lost.
  thinking_levels:
  - max
  - xhigh
  - high
  - medium
  - low
  output_mode: prompted
  slow: true              # doubles per-attempt LLM timeouts — the top reasoning tiers run ~50s/call (max/xhigh probed 2026-07-01), give them headroom
  observed:
    max:
      sample_turns: 0
    xhigh:
      sample_turns: 0
    high:
      sample_turns: 0
    medium:
      sample_turns: 0
    low:
      sample_turns: 0
