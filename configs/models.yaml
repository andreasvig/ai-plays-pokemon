# 2026-07-30 registry sweep — models released since the gpt-5.6 batch (2026-07-10)
# ============================================================================
# Candidates were taken from OpenRouter's live /api/v1/models list (sorted by
# `created`, diffed against this file's openrouter_ids), not from memory, then
# probed with scripts/probe_registry_candidates.py — a REAL FireRed screenshot +
# a spatial-reasoning prompt, one call per (model, tier).
#
# What the probe establishes, and what it does NOT:
#   VERIFIED — the slug resolves, returns 200, reads the screenshot, and answers
#     coherently; which effort tiers are ACCEPTED vs rejected; observed latency
#     and per-call cost; whether a tier produces zero reasoning tokens.
#   NOT ESTABLISHED — that the effort ladder is monotonic. Reasoning-token counts
#     came from single calls and several were bounded by max_tokens rather than by
#     the tier (gemini reported ~669 at max/xhigh/medium under a 700-token cap —
#     that is the cap, not a ladder), and grok-4.5 came back medium 2234 > xhigh
#     1550 > max 1348, i.e. inverted. n=1 is noise, so no entry below claims an
#     ordering. Sample turns stay 0 until a real run measures them.
#
# Two probe bugs to not repeat: a synthetic 1x1 PNG is rejected outright by
# Anthropic ("Could not process image") and xAI ("Invalid PNG image.") while
# Google accepts it, so probing with one manufactures 400s that look like the
# model refusing a tier; and a reasoning-heavy prompt under a tight max_tokens
# can burn the whole budget on thinking and return EMPTY content with HTTP 200.
# ============================================================================

