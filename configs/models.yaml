# --- Xiaomi MiMo V2.5 family ---
# Closed dense reasoning models, 1M context. Binary thinking toggle only —
# no effort tiers exist in Xiaomi's native API (confirmed from
# platform.xiaomimimo.com docs, 2026-04-24). thinking defaults to enabled
# server-side; setting it explicitly makes the behaviour obvious in logs.
#
# Sampling: temperature 0.3 + top_p 0.95 is Xiaomi's own "Function Call"
# recommendation for mimo-v2-flash. Our agent produces structured
# Pydantic-validated GameAction output, which is the same shape, so we
# apply the low-temp Function Call profile rather than the v2.5 blanket
# general-purpose recommendation (1.0 / 0.95).
"mimo-v2.5(thinking)":
  # ~1T total params, AA Intelligence ~54, $0.40/$2.00 per M.
  openrouter_id: "xiaomi/mimo-v2.5"
  reasoning:
    enabled: true
  temperature: 0.3
  top_p: 0.95
  observed:
    avg_turn_cost_usd: 0.0035
    avg_turn_latency_s: 58.6
    sample_turns: 3
    last_updated: 2026-04-24

