# --- Alibaba Qwen3.6-Plus ---
# Hybrid linear-attention + sparse MoE. AA Intelligence 50, 1M context,
# $0.325/$1.95 per M on OpenRouter (cheaper than AA's listed $0.50/$3.00).
# Text + image + video input (AA confirms multimodal — safe for our default
# vision_mode: direct_multimodal, unlike MiMo V2.5 Pro).
#
# Thinking controls: native API is BINARY (enable_thinking boolean) plus
# optional thinking_budget integer. No native effort tiers. OpenRouter accepts
# reasoning.effort and normalizes to thinking_budget under the hood, but we
# stick with the binary convention for parity with MiMo V2.5 / Gemma 4.
#
# Cost caveat: AA flags this model as "very verbose" — 100M output tokens
# during their eval vs 35M median for peers. On an agent loop that already
# produces long structured outputs, this will inflate turn cost beyond what
# the $/M pricing suggests. Watch avg_turn_cost_usd closely after first run.
#
# Sampling: Qwen's general-purpose recs are 0.6/0.95 (thinking) and 0.7/0.8
# (non-thinking). We use 0.3/0.95 to match the structured-output / function-
# call profile used elsewhere in this registry (MiMo, Gemma). Reconsider if
# early runs feel too deterministic or miss good actions.
# Qwen3.6-Plus needs output_mode: "prompted". Two layers of "no":
#   1. OpenRouter providers fronting qwen/qwen3.6-plus don't support
#      tool_choice (verified 2026-04-25, 404 "No endpoints found that
#      support the provided 'tool_choice' value") — rules out output_type=GameAction.
#   2. Pydantic AI's model profile for this model doesn't declare
#      supports_json_schema_output: true, so NativeOutput(GameAction) is
#      rejected client-side ("Native structured output is not supported by
#      the model"). Could be patched via custom ModelProfile but that's
#      brittle to maintain per-model.
# PromptedOutput injects the schema into the system prompt and parses the
# model's JSON text client-side — works for any model. Reasoning models
# like Qwen3.6-Plus (AA 50) are reliable at producing well-formed JSON
# under PromptedOutput. See src/agent/agent.py output_mode branching.
"qwen3.6-plus(thinking)":
  # Observed behaviour (2026-04-25, partial 15T run aborted at turn 14): cheaper
  # per-turn than Gemini 3 Flash high ($0.0069 vs $0.0090) and similar latency
  # (28.2s vs 27.0s) — verbosity warning didn't materialise as expected. BUT:
  # 5 of 15 turns (33%) hit at least one PromptedOutput retry due to model
  # emitting truncated/missing-prefix JSON despite our robust extractor. Each
  # retry adds ~30% turn cost. Effective cost is closer to ~$0.009/turn once
  # retries are factored in. Spatial reasoning was weak — agent stayed stuck
  # in/near the bedroom across 14 turns, similar failure mode to Flash Lite high.
  openrouter_id: "qwen/qwen3.6-plus"
  reasoning:
    enabled: true
  output_mode: "prompted"
  temperature: 0.3
  top_p: 0.95
  observed:
    avg_turn_cost_usd: 0.0069
    avg_turn_latency_s: 28.2
    sample_turns: 15
    last_updated: 2026-04-25
    notes: "33% retry rate from prompted-output JSON quirks. Spatial reasoning weak — got stuck in bedroom like Flash Lite high. Aborted at turn 14."

"qwen3.6-plus(non-thinking)":
  openrouter_id: "qwen/qwen3.6-plus"
  reasoning:
    enabled: false
  output_mode: "prompted"
  temperature: 0.3
  top_p: 0.95
  observed:
    sample_turns: 0
