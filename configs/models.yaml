# Google Gemini 3.5 Flash — $1.50/$9.00 per M, 1M ctx, slug has no -preview. Best capability-per-dollar in registry on this task; recommended default. medium is Google's documented default level.
# LADDER CONFIRMED 2026-08-02 — the cap at `high` is now DOCUMENTED, not inferred: Google's thinking docs (ai.google.dev/gemini-api/docs/thinking) list the Gemini 3 flash levels as exactly minimal/low/medium/high, with NO max and NO xhigh on any Gemini 3 model. Do not add them. Probing them here is worse than useless — uncapped on a hard prompt this model returned high=15321 reasoning tokens, max=11812 and xhigh=7324, i.e. `high` "beat" both, and on gemini-3.1-pro the same probe put xhigh above max. That ordering is noise at n=1, and it is the reason a single measurement must not be allowed to argue against the vendor's own table.
# COST, UNCAPPED — $0.0741-0.1508/call on that hard prompt (8224-16742 completion tokens). Every other cost figure in the Gemini entries here came from a probe with max_tokens set, so they are floors, not ceilings: with no max_tokens (which is what the harness actually sends — no config or registry entry sets one) a reasoning-heavy turn can cost an order of magnitude more than those numbers suggest.
gemini-3.5-flash:
  openrouter_id: google/gemini-3.5-flash
  reasoning_type: effort
  thinking_levels:
  - high
  - medium
  - low
  - minimal
  observed:
    high:
      sample_turns: 0
    medium:
      avg_turn_cost_usd: 0.0129
      avg_turn_latency_s: 6.7
      sample_turns: 50
      last_updated: 2026-05-20
      notes: 'Reached Route 1 + Bulbasaur lvl 6 mid-Rattata-battle at T50 — best in-registry progress on this task, beating Pro(low) 50T''s ''back in Pallet Town at T46''. 68% grade rate, 0 retries. $0.65 / 13.8min for full 50T. Config-3.4 K=1 probe (same model, +1 historic image/turn): +15.2% cost, +27.2% input tokens, −2% grades (noise), 0 explicit historic-image references in reasoning across 50 turns — paid bill didn''t earn it back.'
    low:
      sample_turns: 0
    minimal:
      avg_turn_cost_usd: 0.0125
      avg_turn_latency_s: 11.1
      sample_turns: 20
      last_updated: 2026-05-22
      notes: 20T clean run, 0 retries. Cost near-identical to medium (3% cheaper) because input tokens dominate the bill — no cost-saving rationale to pick minimal over medium for multimodal-agent workloads. Latency 11.1s median / 23.0s max — slightly slower than medium's 6.7s but small sample. 42% grade rate.

