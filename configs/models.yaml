# --- Anthropic Claude Opus 4.7 (added 2026-05-21) ---
# Frontier-of-frontier Anthropic — "built for long-running, asynchronous
# agents." Multimodal (text+image+file→text), 1M context (4× Sonnet 4.6's
# 200K), $5.00/$25.00 per M (~1.7× Sonnet 4.6 input, ~1.7× output).
# Same effort-tier shape (xhigh/high/medium/low/minimal) + same `output_mode:
# "prompted"` constraint as the other Anthropic entries (tool_choice="required"
# silently strips extended thinking — see Haiku 4.5 entry for the incident).
#
# 1M context is the standout spec — preserves all prior thinking across very
# long agent loops without trim pressure. For this project (max 50T, ~7K
# input/turn, ~5K output/turn = ~600K total budget) we never approach the
# ceiling, but Opus's full-history retention should help multi-turn planning
# more than Sonnet's 200K.
#
# Cost extrapolation: Sonnet 4.6 (medium) was $0.0557/turn — Opus 4.7
# (medium) will likely land in the $0.08-0.12/turn range. 10T probe ~$1,
# 50T ~$5. Highest-cost entry in registry by a wide margin if confirmed.
"claude-opus-4.7(xhigh)":
  # Anthropic's native API for Opus 4.7 uses `thinking: {type: "adaptive",
  # effort: "low"|"medium"|"high"}` only — there is no native xhigh tier.
  # OpenRouter accepts xhigh at the API surface and per their docs maps
  # "to the nearest supported level."
  #
  # Observed (2026-05-21, 20T probe on config-3.10): xhigh and medium are
  # functionally indistinguishable on this task.
  #
  # | metric              | (medium) 10T | (xhigh) 20T | Δ        |
  # |---------------------|-------------:|------------:|---------:|
  # | Cost / turn         | $0.0523      | $0.0551     | +5%      |
  # | Latency / turn      | 8.3s         | 8.7s        | +5%      |
  # | Output tokens / turn| ~300         | ~319        | +6%      |
  # | Grade rate (true)   | 78%          | 84%         | +6pp     |
  # | End state           | Pallet Town  | Oak's Lab   | +1 scene |
  #
  # All numeric deltas are within run-to-run noise. The deeper end-state
  # is most likely explained by 2× the turn budget rather than the
  # effort tier. Two consistent explanations:
  #   1. OpenRouter clamps xhigh→high before sending to Anthropic (since
  #      Anthropic's native adaptive API only supports low/medium/high).
  #   2. Adaptive thinking on Opus 4.7 picks its own budget dynamically
  #      regardless of the effort hint passed.
  # Either way: don't expect xhigh to materially outperform medium on
  # Opus 4.7. Save the registry slot but prefer (medium) for cost; the
  # 5% premium of xhigh buys ~noise.
  #
  # T17 single-outlier: 30.9s / 1415 output tokens / $0.085 — extended-
  # thinking spike on one turn, otherwise the band stayed at 5-10s/turn.
  # Total run: $1.10 / 20T / ~4 min wall clock.
  openrouter_id: "anthropic/claude-opus-4.7"
  reasoning:
    effort: "xhigh"
  output_mode: "prompted"
  observed:
    avg_turn_cost_usd: 0.0551
    avg_turn_latency_s: 8.7
    sample_turns: 20
    last_updated: 2026-05-21
    notes: "Reached Inside Oak's Lab at T20 with pallet_town + oaks_lab mapped in detail. 32/38 true (84%). xhigh ≈ medium on this task within run-to-run noise: $0.0551 vs $0.0523 per turn (+5%), 319 vs 300 output tokens/turn (+6%), 8.7s vs 8.3s/turn (+5%). Either OpenRouter clamps xhigh→high (since Anthropic native adaptive only supports low/medium/high) or adaptive thinking ignores the effort hint and picks its own budget. Use (medium) for cost — the 5% xhigh premium buys ~noise. config-3.10."

