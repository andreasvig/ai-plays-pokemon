# ============================================================================
# RETIRED ENTRIES — resolvable, not runnable, and not for the picker
# ============================================================================
# These two are NOT on the config-5.0 keep list. They are here only because a
# hard-coded alias in src/ still resolves against this file (see the prune banner
# at the top for the exact call sites) and `resolve_model_selection` sys.exit()s
# on an unknown alias. They deliberately have NO entry in
# configs/provider-profiles.yaml.
#
# That does NOT make them unrunnable on config-5.0 — checked, not assumed.
# resolve_provider_profile now applies the `defaults:` block to an unprofiled
# model (decision 2026-09-07, finding #9), so a config-5.0 run of one of these
# loads: it gets `transforms: []`, a cache mode and the drift guard, with
# `endpoint: ""` (unpinned, `provider.only` omitted) and `unprofiled: true`
# recorded on the resolved profile. What it does NOT get is a probed endpoint,
# so the run is uncertified — the endpoint, quantization, cache regime and
# replay behaviour are whatever the router picks that minute. That is the reason
# these must be hidden from the picker, and the reason the flag is named
# `retired` rather than left implicit.
#
# Retire the entry, then delete it once its caller stops naming it. The `retired`
# flag exists so the picker can hide them; that filtering is somebody else's
# change, not something this file can enforce.
# ============================================================================

# Google Gemini 3.5 Flash — $1.50/$9.00 per M, 1M ctx, slug has no -preview. Best capability-per-dollar in registry on this task; recommended default. medium is Google's documented default level.
# LADDER CONFIRMED 2026-08-02 — the cap at `high` is now DOCUMENTED, not inferred: Google's thinking docs (ai.google.dev/gemini-api/docs/thinking) list the Gemini 3 flash levels as exactly minimal/low/medium/high, with NO max and NO xhigh on any Gemini 3 model. Do not add them. Probing them here is worse than useless — uncapped on a hard prompt this model returned high=15321 reasoning tokens, max=11812 and xhigh=7324, i.e. `high` "beat" both, and on gemini-3.1-pro the same probe put xhigh above max. That ordering is noise at n=1, and it is the reason a single measurement must not be allowed to argue against the vendor's own table.
# COST, UNCAPPED — $0.0741-0.1508/call on that hard prompt (8224-16742 completion tokens). Every other cost figure in the Gemini entries here came from a probe with max_tokens set, so they are floors, not ceilings: with no max_tokens (which is what the harness actually sends — no config or registry entry sets one) a reasoning-heavy turn can cost an order of magnitude more than those numbers suggest.
gemini-3.5-flash:
  openrouter_id: google/gemini-3.5-flash
  reasoning_type: effort
  retired: true   # see the RETIRED ENTRIES banner above

  thinking_levels:
  - high
  - medium
  - low
  - minimal
  observed:
    high:
      sample_turns: 0
    medium:
      avg_turn_cost_usd: 0.0129
      avg_turn_latency_s: 6.7
      sample_turns: 50
      last_updated: 2026-05-20
      notes: 'Reached Route 1 + Bulbasaur lvl 6 mid-Rattata-battle at T50 — best in-registry progress on this task, beating Pro(low) 50T''s ''back in Pallet Town at T46''. 68% grade rate, 0 retries. $0.65 / 13.8min for full 50T. Config-3.4 K=1 probe (same model, +1 historic image/turn): +15.2% cost, +27.2% input tokens, −2% grades (noise), 0 explicit historic-image references in reasoning across 50 turns — paid bill didn''t earn it back.'
    low:
      sample_turns: 0
    minimal:
      avg_turn_cost_usd: 0.0125
      avg_turn_latency_s: 11.1
      sample_turns: 20
      last_updated: 2026-05-22
      notes: 20T clean run, 0 retries. Cost near-identical to medium (3% cheaper) because input tokens dominate the bill — no cost-saving rationale to pick minimal over medium for multimodal-agent workloads. Latency 11.1s median / 23.0s max — slightly slower than medium's 6.7s but small sample. 42% grade rate.
# Xiaomi MiMo V2.5 — binary thinking, ~1T params, 1M ctx, $0.40/$2.00 per M. MULTIMODAL (text/audio/image/video, confirmed OpenRouter API 2026-06-17). thinking is slow (~58s/turn) — slow flag doubles its timeouts; it is NOT broken (the 2026-06-16 turn-0 death was the old 60s timeout). Sampling 0.3/0.95 (Xiaomi function-call profile).

# Anthropic Claude Opus 4.7 — effort-tiered (xhigh maps to nearest native adaptive level), 1M ctx, $5/$25 per M, multimodal. output_mode prompted REQUIRED. First non-Gemini to clear the spatial-grounding bottleneck (medium reached Pallet Town). xhigh ≈ medium on this task (within noise) — prefer medium for cost.
claude-opus-4.7:
  openrouter_id: anthropic/claude-opus-4.7
  reasoning_type: effort
  retired: true   # see the RETIRED ENTRIES banner above
  # TIER AUDIT 2026-08-02 — `max` added (documented for Opus 4.7, and by far the
  # widest gap measured in this sweep: 2704 reasoning / 12737 completion / 127.0s
  # / $0.3187 vs xhigh at 261 / 2267 / 26.4s / $0.0570). That is ~5.6x the cost
  # and ~5x the latency of xhigh on one prompt — a deliberate ceiling tier, not a
  # routine pick, and slow enough to be worth a slow flag if it ever gets used.
  thinking_levels:
  - max
  - xhigh
  - high
  - medium
  - low
  - minimal
  output_mode: prompted
  observed:
    max:
      sample_turns: 0
    xhigh:
      avg_turn_cost_usd: 0.0551
      avg_turn_latency_s: 8.7
      sample_turns: 20
      last_updated: 2026-05-21
      notes: 'Reached Inside Oak''s Lab at T20 with pallet_town + oaks_lab mapped in detail. 32/38 true (84%). xhigh ≈ medium on this task within run-to-run noise: $0.0551 vs $0.0523 per turn (+5%), 319 vs 300 output tokens/turn (+6%), 8.7s vs 8.3s/turn (+5%). Either OpenRouter clamps xhigh→high (since Anthropic native adaptive only supports low/medium/high) or adaptive thinking ignores the effort hint and picks its own budget. Use (medium) for cost — the 5% xhigh premium buys ~noise. config-3.10.'
    high:
      sample_turns: 0
    medium:
      avg_turn_cost_usd: 0.0523
      avg_turn_latency_s: 8.3
      sample_turns: 10
      last_updated: 2026-05-21
      notes: 'Reached Pallet Town (out of the house) by T10 with map memory written — first non-Gemini model in registry to clear the spatial-grounding bottleneck. 14/18 true (78%) genuine grade rate. ~300 output tokens/turn (8× more terse than Sonnet 4.6 medium''s 2338). $0.0523/turn — LOWER per-turn cost than Sonnet despite higher rate card. 8.3s latency — fastest Anthropic in registry. config-3.9. Recommended next: 50T to compare against Gemini 3.5 Flash (medium) at Route 1.'
    low:
      sample_turns: 0
    minimal:
      sample_turns: 0
