  # all 10 turns — never went down the stairs. Same spatial-grounding
  # failure mode as Grok 4.3 / Flash Lite (high) / Qwen3.6-Plus / Perceptron
  # Mk1 / Haiku 4.5 (medium) / Grok Build 0.1 (medium).
  #
  # What was BETTER than peers in the same failure family:
  #   - Honest self-grading: 0/18 true (0%) — never gamed last_turn_succeeded
  #     the way GPT-5.5(medium) on config-3.0 did or Grok Build did at T4.
  #     Sonnet correctly graded every stuck-in-place turn as false.
  #   - Self-diagnosis at T10: "screenshots have been identical for 9+ turns
  #     despite many varied button presses including all directions. This
  #     almost certainly means something is blocking input — possibly a
  #     hidden dialogue/event." Tried `[b, b, b, a, up, up, up, right, right]`
  #     to recover. No other model in this failure family has surfaced the
  #     stuck-state explicitly in reasoning prose.
  #   - 5× faster than Grok Build 0.1 (medium) on the same task (47.7s/turn
  #     vs 118.6s/turn).
  #
  # What was WORSE: cost. $0.557/10T = $0.0557/turn — most expensive entry
  # in the registry by ~2× over Haiku 4.5 (medium) ($0.0303) and GPT-5.5
  # (medium) ($0.0298). T9 alone burned $0.15 with 8362 output tokens
  # (extended thinking spiral, 160s latency). Cost extrapolates to ~$2.80
  # for 50T.
  #
  # Verdict: same capability tier as the bedroom-stuck cluster, but the
  # honest grading + explicit stuck-detection make it the highest-trust
  # entry in that cluster. If we eventually break the spatial-grounding
  # bottleneck (e.g. higher upscale, better tile-coordinate prompting,
  # vision_mode tweak), Sonnet's reasoning quality may pay off. Not
  # recommended at current cost without that fix.
  openrouter_id: "anthropic/claude-sonnet-4.6"
  reasoning:
    effort: "medium"
  output_mode: "prompted"
  observed:
    avg_turn_cost_usd: 0.0557
    avg_turn_latency_s: 47.7
    sample_turns: 10
    last_updated: 2026-05-21
    notes: "Stuck on 2F bedroom — 0/18 self-grade true (0%, fully honest, never claimed false success). T9 latency spike 160s / 8362 output tokens (extended-thinking spiral). T10 reasoning self-diagnosed stuck state explicitly. Total $0.557/10T. Most expensive in registry by ~2× over Haiku 4.5 (medium) / GPT-5.5 (medium). 5× faster per turn than Grok Build 0.1 (medium). config-3.8."

