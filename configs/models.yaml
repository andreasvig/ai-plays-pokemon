# MoonshotAI Kimi K3 (released 2026-07-16) — multimodal (text+image, unlike the text-only k2.x entries), 1M ctx, $3/$15 per M. IMPORTANT DEPARTURE from kimi-k2.6 / kimi-k2.7-code: K3 is reasoning_type EFFORT, not the binary thinking/non-thinking toggle the k2.x family uses — it advertises reasoning_effort and accepted max/xhigh/high/medium/low with 200 on the 2026-07-30 probe, so do not clone a k2.x entry for it. Read the screenshot and solved the spatial task. Default tool output mode (tool_choice + structured_outputs advertised). slow: true — the SLOWEST acceptable model in this sweep at 18-54s/call, and it served from three different providers across probes (Moonshot AI, Together, DigitalOcean), so latency will swing with routing. Cost $0.009-0.023/call.
kimi-k3:
  openrouter_id: moonshotai/kimi-k3
  reasoning_type: effort
  # TIER AUDIT 2026-08-02 — `none` added. Probed uncapped on a hard prompt:
  # none -> 0 reasoning / 1166 completion / 16.5s / $0.0178, against low at
  # 1116 / 1552 / 20.7s / $0.0234. Zero reasoning tokens is unambiguous, so this
  # is a real off-switch, not an adaptive model declining to think — and it was
  # simply not exposed before. `none` as a rung is already the convention on
  # every gpt-5.6-* entry here.
  # `minimal` is deliberately NOT added: it returned 1846 reasoning / 2251
  # completion, i.e. MORE thinking than the tier below it. Whatever OpenRouter
  # maps it to on this model, it is not a rung under `low`, and adding it would
  # put an inverted step in the ladder.
  thinking_levels:
  - max
  - xhigh
  - high
  - medium
  - low
  - none
  slow: true              # 18-54s/call, and provider routing swings it further
  observed:
    max:
      sample_turns: 0
    xhigh:
      sample_turns: 0
    high:
      sample_turns: 0
    medium:
      sample_turns: 0
    low:
      sample_turns: 0
    none:
      sample_turns: 0

# Qwen3.7 Flash (released 2026-07-28, the newest model in this sweep) — BINARY thinking toggle like the other Qwen entries (it advertises `reasoning` but NOT reasoning_effort), multimodal (text/image/video), 1M ctx. output_mode prompted, matching qwen3.6-plus / qwen3.7-plus: it advertises tool_choice but NOT structured_outputs, and the Qwen family has needed prompted mode throughout. Probed 2026-07-30 (after an initial upstream 429 cleared — a rate limit, not a model limit): both rungs 200 and it read the screenshot in each. ABSURDLY CHEAP — $0.03/$0.13 per M, i.e. $0.00026/call thinking and $0.000048 non-thinking, ~500x cheaper per call than opus-5; a full long run costs cents. Caveat worth knowing before trusting it as a Player: in thinking mode it described the screenshot as "a pixel-art map editor interface", while non-thinking mode correctly read the room (bed, desk, character on a rug) — so on this model more thinking made the perception WORSE on a single observation. slow flag is thinking-only: 43s with thinking on, 2.6s with it off.
qwen3.7-flash:
  openrouter_id: qwen/qwen3.7-flash
  reasoning_type: binary
  thinking_levels:
  - thinking
  - non-thinking
  output_mode: prompted
  slow:
    thinking: true        # 43s with thinking on vs 2.6s off
  observed:
    thinking:
      sample_turns: 0
    non-thinking:
      sample_turns: 0

# Thinking Machines Inkling (released 2026-07-18) — effort-tiered, multimodal (text/image/audio), 1M ctx, $1/$4.05 per M. output_mode prompted, but NOT for the reason first written here. The old note said "advertises NEITHER response_format NOR structured_outputs, so both tool mode and native_json are unavailable" — the native_json half is right, the tool-mode half is wrong: tool mode needs `tools` + `tool_choice`, neither of which is response_format, and BaseTen and Together both advertise them. The REAL reason is routing (re-probed 2026-08-02): of the 3 endpoints, DeepInfra is the cheapest ($0.95/M vs $1.00/M) and default price/uptime routing served it on all 7 probe calls — and DeepInfra is the ONE endpoint with tools=False. So prompted is correct in practice while routing is unpinned; pinning provider: {order: [BaseTen, Together]} would make tool mode reachable if ever wanted. Effort ladder measured 2026-08-02: max=2955 / high=3126 / low=971 reasoning tokens — `max` and `high` are indistinguishable (max scored LOWER), so `max` is likely a clamp of `high`, the same shape as opus-5's omitted `minimal`. n=1 per tier; repeat before collapsing them. Probed 2026-07-30 via Together: 200, read the screenshot, solved the spatial task; max/high/medium/low accepted. slow: true — 14.8-58.3s/call. First entry from this lab in the registry, so treat the whole entry as first-run-confirms.
inkling:
  openrouter_id: thinkingmachines/inkling
  reasoning_type: effort
  thinking_levels:
  - max
  - high
  - medium
  - low
  output_mode: prompted
  slow: true              # 14.8-58.3s/call
  observed:
    max:
      sample_turns: 0
    high:
      sample_turns: 0
    medium:
      sample_turns: 0
    low:
      sample_turns: 0

# StepFun Step 3.7 Flash (released 2026-05-28) — effort-tiered, multimodal (text/image/video), 262K ctx, $0.20/$1.15 per M. Default tool output mode (tool_choice + structured_outputs advertised). Probed 2026-07-30: 200 via StepFun, and on a SHORT prompt it read the screenshot correctly (identified the bedroom, rug, PC). KEPT BUT RANKED LOW because of a real failure mode observed on the harder prompt: at max_tokens 2500 it consumed the entire budget and returned HTTP 200 with EMPTY content — which for the Player is a dead turn, not an error the retry logic recognises as one. Its reasoning telemetry is also inconsistent (752 reasoning tokens reported with no reasoning block sent, 0 reported with effort=high), so the counts here are not trustworthy for tuning. CAUSE FOUND 2026-08-02: it is provider-dependent, not model-dependent. Three identical calls landed on three endpoints and reported reasoning tokens 0 (Novita), 0 (StepFun) and 2637 (DeepInfra) — while the reasoning TEXT came back at 9050/9465/10363 chars every time. The model thinks consistently; two of three endpoints just do not report the count. Cost was identical, so billing is unaffected, but any per-tier reasoning measurement on this model is a coin flip on routing unless the provider is pinned. If you run it, give it a generous max_tokens and watch for empty outputs before drawing any conclusion about its play.
step-3.7-flash:
  openrouter_id: stepfun/step-3.7-flash
  reasoning_type: effort
  thinking_levels:
  - high
  - medium
  - low
  observed:
    high:
      sample_turns: 0
    medium:
      sample_turns: 0
    low:
      sample_turns: 0

