  reasoning_type: binary
  # `temperature: 0.3` / `top_p: 0.95` removed 2026-09-07: on a profiled run
  # AppendAgent._body() REPLACES the resolved registry settings wholesale with the
  # profile's, so registry sampling never reached the wire under config-5.0. The
  # same two values now live in this model's `sampling:` block in
  # configs/provider-profiles.yaml — one declaration, and the one the harness reads.
  thinking_levels:
  - thinking
  - non-thinking
  output_mode: prompted
  # `provider: {sort: throughput}` removed 2026-09-07 (decision D3): this model has
  # a provider profile pinning `deepinfra/turbo`, and the profile owns the endpoint.
  # The two disagreed — a throughput sort names no endpoint while the profile names
  # one — and the append path silently resolved it in the profile's favour. Legacy
  # (config-4.0 / 3.13) runs of this model are now default-routed rather than
  # throughput-sorted. `deepinfra/turbo` was itself the throughput choice, probed.
  slow:
    thinking: true
  observed:
    thinking:
      avg_turn_cost_usd: 0.0013
      avg_turn_latency_s: 74.9
      sample_turns: 46
      last_updated: 2026-05-22
      notes: '50T attempt 2026-05-22 PRE-retry-fix: 46/50 turns then crashed at T47 with NoneType subscript (wrapped-5xx). Cost $0.0584 / 46 turns / $0.0013/turn — cheapest model in the registry by 10×. Turn-to-turn wall: median 55.6s, mean 74.9s, range 8.9-220.9s. 49% LLM self-grade true-rate (22/23/1). Game progress: got Bulbasaur lvl 5, exited bedroom + lab, dialogue-looped by Oak''s wild-Pokemon warning, never exited Pallet Town. Slow-tail providers (Chutes/Together) drag mean up; T19=220.9s, T46=208.4s. The retry-with-timeout layer in src/agent/turn.py (60s/60s/180s) was added after this run to survive the wrapped-5xx case — would have recovered T47. Provider name surfaces in turn output via pydantic-ai model_name fallback (''google/gemma-4-31b-it-20260402'') — actual OpenRouter provider not exposed via msg.provider_details.'
    non-thinking:
      sample_turns: 0
# Google Gemma 4 26B A4B IT — binary thinking, 262K ctx, $0.07/$0.34 per M. Also the project's OCR cleanup model. output_mode prompted (mixed provider capability). thinking was 'unusable on default throughput-sort' (>60s/turn) under the old 3-attempt/60s retry — the slow flag + 6-attempt rework target exactly this.
# MoonshotAI Kimi K3 (released 2026-07-16) — multimodal (text+image, unlike the text-only k2.x entries), 1M ctx, $3/$15 per M. IMPORTANT DEPARTURE from kimi-k2.6 / kimi-k2.7-code: K3 is reasoning_type EFFORT, not the binary thinking/non-thinking toggle the k2.x family uses — it advertises reasoning_effort and accepted max/xhigh/high/medium/low with 200 on the 2026-07-30 probe, so do not clone a k2.x entry for it. Read the screenshot and solved the spatial task. Default tool output mode (tool_choice + structured_outputs advertised). slow: true — the SLOWEST acceptable model in this sweep at 18-54s/call, and it served from three different providers across probes (Moonshot AI, Together, DigitalOcean), so latency will swing with routing. Cost $0.009-0.023/call.
kimi-k3:
  openrouter_id: moonshotai/kimi-k3
  reasoning_type: effort
  # `xhigh`, `medium` and `none` dropped 2026-09-07: OpenRouter enumerates this
  # model's reasoning.supported_efforts as exactly max/high/low, so all three were
  # sent as efforts the endpoint does not define. `none` is the sharpest case — the
  # provider profile marks reasoning as mandatory, so a kimi-k3(none) run raised
  # ValueError inside build_run_config after the queue card had already gone active
  # (finding #5 of artifacts/append-standard-frontend-review/plan.md). All three
  # `observed` rows had sample_turns 0, so no measurement is lost. The 2026-09-06
  # effort sweep on moonshotai/mxfp4 measured 0 / 39 / 121 / 118 reasoning tokens at
  # off / low / high / max, i.e. `max` buys nothing over `high` either.
  # TIER AUDIT 2026-08-02 — `none` added. Probed uncapped on a hard prompt:
  # none -> 0 reasoning / 1166 completion / 16.5s / $0.0178, against low at
  # 1116 / 1552 / 20.7s / $0.0234. Zero reasoning tokens is unambiguous, so this
  # is a real off-switch, not an adaptive model declining to think — and it was
  # simply not exposed before. `none` as a rung is already the convention on
  # every gpt-5.6-* entry here.
  # `minimal` is deliberately NOT added: it returned 1846 reasoning / 2251
  # completion, i.e. MORE thinking than the tier below it. Whatever OpenRouter
  # maps it to on this model, it is not a rung under `low`, and adding it would
  # put an inverted step in the ladder.
  thinking_levels:
  - max
  - high
  - low
  slow: true              # 18-54s/call, and provider routing swings it further
  observed:
    max:
      sample_turns: 0
    high:
      sample_turns: 0
    low:
      sample_turns: 0
