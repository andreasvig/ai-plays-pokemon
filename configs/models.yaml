# Google Gemma 4 31B IT — binary thinking, open-weights, 262K ctx, $0.13/$0.38 per M (cheapest). output_mode prompted + provider throughput-sort: providers have mixed tool/structured-output support, so prompted + fastest-provider routing is the robust combo. thinking is slow (74.9s/turn, slow-provider tail to 220s).
