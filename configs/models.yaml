  # send, and restoring it is the one-line fix if a legacy arm of this model ever
  # has to be endpoint-matched to the append arm again.
  observed:
    max:
      sample_turns: 0
    xhigh:
      sample_turns: 0
    high:
      sample_turns: 0
    medium:
      sample_turns: 0
    low:
      sample_turns: 0
