# --- Google Gemini 3.5 Flash (added 2026-05-20) ---
# Same effort-tier shape as the rest of the Gemini 3 family
# (high/medium/low/minimal); medium is Google's documented default.
# Pricing: $1.50/$9.00 per M — 3× the cost of gemini-3-flash ($0.50/$3.00)
# and ~75% of gemini-3.1-pro ($2.00/$12.00). Sits between Flash and Pro on
# cost; first runs will tell us where it sits on capability.
# OpenRouter slug has no `-preview` suffix (unlike 3-flash / 3.1-pro).
"gemini-3.5-flash(high)":
  openrouter_id: "google/gemini-3.5-flash"
  reasoning:
    effort: "high"
  observed:
    sample_turns: 0

"gemini-3.5-flash(medium)":
  # Google's documented default thinking level for this model.
  #
  # Observed (2026-05-20, 50T run on config-3.2): **new best in registry on
  # actual game progress.** Final state.json: on Route 1 with Bulbasaur
  # lvl 6 (22/22 HP, moves: tackle/growl), mid-battle with a wild Rattata
  # at T50. Cleared the full early-game arc — bedroom → 1F → Pallet Town
  # → Oak's lab → starter (Bulbasaur) → leveled to 6 → exited north → Route 1.
  # One step further than Pro(low)'s 50T run (which ended back in Pallet Town
  # overworld at T46 with Squirtle lvl 6) and far past Pro(medium)'s 20T
  # (only Oak's Lab + Charmander by T20).
  #
  # Cost $0.0129/turn — 32% cheaper than Pro(low)'s $0.0158, 18% cheaper
  # than gemini-3-flash(low)'s comparable budget (when factoring frontier
  # capability). Total run cost $0.65 / 50T / 13.8 min wall-clock.
  # Latency 6.7s/turn — faster than both Pro tiers (~11s) and Grok 4.3
  # (71s). 0 LLM retries across all 50 turns. 68% grade rate (34/15/1
  # true/false/null) — high without the conservative-prediction self-grade-
  # gaming that GPT-5.5(medium) showed. Output 586 tokens/turn (29307 total)
  # — terse for a frontier reasoning model.
  #
  # Verdict: best capability-per-dollar entry in the registry for this
  # task. Recommended default for new benchmark configs.
  #
  # Observed (2026-05-20, 50T run on config-3.4 — same model, K=1 historic
  # image probe): mechanically works, qualitatively a wash. Same end-state
  # as config-3.2 K=0 baseline (Route 1, Bulbasaur lvl 6, 22/22 HP). 33/16/1
  # grades (66%) vs K=0's 34/15/1 (68%) — −1 grade = noise. Per-turn cost
  # $0.0150 vs K=0's $0.0129 (+15.2%); per-turn input tokens 6503 vs K=0's
  # 5114 (+27.2%, +1389/turn — matches the +1435 prediction from the 10T
  # probe within noise). Output tokens went DOWN −2.1% — model reasoned
  # slightly more concisely with the extra image.
  #
  # The notable finding: in 50 turns of reasoning + thinking text, the
  # model wrote ZERO explicit references to the historic image ("Screenshot
  # 1", "first screenshot", "previous screen", "before actions", "compared
  # to", "two images" — all 0 hits). 17 "last turn" mentions all looked at
  # text history, not the image. The 10T probe got exactly 1 explicit
  # reference ("Screenshot 1, taken before the second turn") that didn't
  # reproduce at 50T scale. Either the model uses the historic image
  # purely implicitly via visual attention without verbalizing the
  # comparison, or it largely ignores it.
  #
  # Verdict on K=1 for this model + task: paid the bill, didn't earn it
  # back. Stick with K=0 as default for gemini-3.5-flash. K>0 may still
  # be worth trying with models that have different multimodal architectures
  # (Claude / GPT-5) where the joint-vision-transformer assumption doesn't
  # hold and explicit image labeling may carry more weight.
  openrouter_id: "google/gemini-3.5-flash"
  reasoning:
    effort: "medium"
  observed:
    avg_turn_cost_usd: 0.0129
    avg_turn_latency_s: 6.7
    sample_turns: 50
    last_updated: 2026-05-20
    notes: "Reached Route 1 + Bulbasaur lvl 6 mid-Rattata-battle at T50 — best in-registry progress on this task, beating Pro(low) 50T's 'back in Pallet Town at T46'. 68% grade rate, 0 retries. $0.65 / 13.8min for full 50T. Config-3.4 K=1 probe (same model, +1 historic image/turn): +15.2% cost, +27.2% input tokens, −2% grades (noise), 0 explicit historic-image references in reasoning across 50 turns — paid bill didn't earn it back."

"gemini-3.5-flash(low)":
  openrouter_id: "google/gemini-3.5-flash"
  reasoning:
    effort: "low"
  observed:
    sample_turns: 0

"gemini-3.5-flash(minimal)":
  openrouter_id: "google/gemini-3.5-flash"
  reasoning:
    effort: "minimal"
  observed:
    sample_turns: 0

