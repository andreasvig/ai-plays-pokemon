# --- Alibaba Qwen3.6-Plus ---
# Hybrid linear-attention + sparse MoE. AA Intelligence 50, 1M context,
# $0.325/$1.95 per M on OpenRouter (cheaper than AA's listed $0.50/$3.00).
# Text + image + video input (AA confirms multimodal — safe for our default
# vision_mode: direct_multimodal, unlike MiMo V2.5 Pro).
#
# Thinking controls: native API is BINARY (enable_thinking boolean) plus
# optional thinking_budget integer. No native effort tiers. OpenRouter accepts
# reasoning.effort and normalizes to thinking_budget under the hood, but we
# stick with the binary convention for parity with MiMo V2.5 / Gemma 4.
#
# Cost caveat: AA flags this model as "very verbose" — 100M output tokens
# during their eval vs 35M median for peers. On an agent loop that already
# produces long structured outputs, this will inflate turn cost beyond what
# the $/M pricing suggests. Watch avg_turn_cost_usd closely after first run.
#
# Sampling: Qwen's general-purpose recs are 0.6/0.95 (thinking) and 0.7/0.8
# (non-thinking). We use 0.3/0.95 to match the structured-output / function-
# call profile used elsewhere in this registry (MiMo, Gemma). Reconsider if
# early runs feel too deterministic or miss good actions.
# Qwen3.6-Plus needs output_mode: "prompted". Two layers of "no":
#   1. OpenRouter providers fronting qwen/qwen3.6-plus don't support
#      tool_choice (verified 2026-04-25, 404 "No endpoints found that
#      support the provided 'tool_choice' value") — rules out output_type=GameAction.
#   2. Pydantic AI's model profile for this model doesn't declare
#      supports_json_schema_output: true, so NativeOutput(GameAction) is
#      rejected client-side ("Native structured output is not supported by
#      the model"). Could be patched via custom ModelProfile but that's
#      brittle to maintain per-model.
# PromptedOutput injects the schema into the system prompt and parses the
# model's JSON text client-side — works for any model. Reasoning models
# like Qwen3.6-Plus (AA 50) are reliable at producing well-formed JSON
# under PromptedOutput. See src/agent/agent.py output_mode branching.
"qwen3.6-plus(thinking)":
  # Observed behaviour (2026-04-25, partial 15T run aborted at turn 14): cheaper
  # per-turn than Gemini 3 Flash high ($0.0069 vs $0.0090) and similar latency
  # (28.2s vs 27.0s) — verbosity warning didn't materialise as expected. BUT:
  # 5 of 15 turns (33%) hit at least one PromptedOutput retry due to model
  # emitting truncated/missing-prefix JSON despite our robust extractor. Each
  # retry adds ~30% turn cost. Effective cost is closer to ~$0.009/turn once
  # retries are factored in. Spatial reasoning was weak — agent stayed stuck
  # in/near the bedroom across 14 turns, similar failure mode to Flash Lite high.
  openrouter_id: "qwen/qwen3.6-plus"
  reasoning:
    enabled: true
  output_mode: "prompted"
  temperature: 0.3
  top_p: 0.95
  observed:
    avg_turn_cost_usd: 0.0069
    avg_turn_latency_s: 28.2
    sample_turns: 15
    last_updated: 2026-04-25
    notes: "33% retry rate from prompted-output JSON quirks. Spatial reasoning weak — got stuck in bedroom like Flash Lite high. Aborted at turn 14."

"qwen3.6-plus(non-thinking)":
  openrouter_id: "qwen/qwen3.6-plus"
  reasoning:
    enabled: false
  output_mode: "prompted"
  temperature: 0.3
  top_p: 0.95
  observed:
    sample_turns: 0

# --- xAI Grok 4.3 ---
# Always-on reasoning — no effort tiers, no binary toggle. OpenRouter docs:
# "Reasoning is always active and cannot be disabled or configured by effort
# level." Third reasoning shape in this registry alongside effort-tiered
# (Gemini 3, OpenAI) and binary (MiMo, Gemma, Qwen). Multimodal (text+image),
# 1M context, $1.25/$2.50 per M. Tiered pricing above 200k total tokens.
#
# Observed (2026-05-01, partial 36T run on config-3.0, aborted at T36): bad
# fit for this task. Stuck in 1F Player's House for the entire run — got out
# of the bedroom but never made it to Pallet Town overworld. 3/35 grade=true
# (8.3%) vs Gemini 3 Pro low's 25/50 (50%) on the identical task. Cost-per-
# turn ($0.0162) is comparable to Pro low ($0.0158), but per-turn latency
# (71.7s, range 24-250s, p99 outliers) is 6× worse than Pro low (11.4s).
# Output tokens averaged 3815/turn — roughly 2× the other registry entries
# at this scene complexity, consistent with the always-on reasoning producing
# verbose traces. No retries observed (validation worked first-try most turns,
# one retry at T17). Per-turn cost-per-success is ~$0.19 here vs Pro low's
# ~$0.032 — ~6× worse on this task.
#
# Why so bad: spatial reasoning failure mode, similar to Flash Lite (high)
# and Qwen3.6-Plus — agent identifies the door, plans a sweep, presses
# directional inputs, but never lands on the door tile. Grok's reasoning
# trace shows it knows what it's trying to do; the bottleneck is screen-
# state grounding, not task planning. Worth retrying once direct_multimodal
# vision improves or with a snapshot that starts in Pallet Town overworld
# (skip the 1F navigation entirely).
#
# No reasoning block below — omitted per the schema convention so neither
# effort nor enabled is sent to OpenRouter.
"grok-4.3":
  openrouter_id: "x-ai/grok-4.3"
  observed:
    avg_turn_cost_usd: 0.0162
    avg_turn_latency_s: 71.7
    sample_turns: 35
    last_updated: 2026-05-01
    notes: "3/35 grade=true (8.3%). Stuck in 1F Player's House — never reached overworld. ~6× slower per turn than Pro low at similar cost. Latency variance huge (24s–250s)."

# --- OpenAI GPT-5 family ---
# Effort-tiered reasoning matching Gemini 3's shape: xhigh / high / medium /
# low / minimal (per OpenRouter docs, "Reasoning Effort Values"). xhigh
# allocates ~95% of max_tokens to reasoning, low ~20%, minimal ~10%.
# Multimodal (text+image input). Frontier-tier pricing on GPT-5.5
# ($5/$30 per M) — 3× Gemini 3.1 Pro on input, 2.5× on output. Nano is
# the cheap-at-scale entry ($0.20/$1.25 per M, similar tier to Grok 4 Fast).
"gpt-5.5(low)":
  # Frontier tier, 1.05M context (922K input / 128K output).
  # Low-effort variant: ~20% of max_tokens for reasoning.
  #
  # Observed (2026-05-01, 20T run on config-3.0): fastest model in the
  # registry — 4.9s/turn (range 3.8–6.1, very tight variance) vs Pro low's
  # 11.4s and Grok 4.3's 71.7s. Cost ($0.0190/turn) is comparable to
  # everything else despite frontier pricing, because output tokens are
  # very low (193/turn — 10-20× less verbose than other reasoning models).
  # That's the low-effort tier doing what it says on the tin: ~20% of
  # max_tokens for reasoning, and the prose output stays terse.
  #
  # Success: 2/20 (10%), same bedroom-stuck failure mode as Flash Lite
  # high / Qwen3.6-Plus / Grok 4.3. Low effort isn't enough reasoning
  # budget for the spatial grounding bottleneck. (medium) is the natural
  # next probe — same speed/cost neighborhood plus ~50% reasoning budget.
  openrouter_id: "openai/gpt-5.5"
  reasoning:
    effort: "low"
  observed:
    avg_turn_cost_usd: 0.0190
    avg_turn_latency_s: 4.9
    sample_turns: 20
    last_updated: 2026-05-01
    notes: "2/20 grade=true (10%). Fastest in registry (4.9s/turn, 2-15× faster than peers). Very terse outputs (193 output tokens/turn). Bedroom-stuck — low effort underpowered for spatial grounding."

"gpt-5.5(medium)":
  # Same model, ~50% of max_tokens for reasoning.
  #
  # Observed (2026-05-01, 20T run on config-3.0): **gamed the
  # last_turn_succeeded metric — does NOT actually play the game well.**
  # Final state.json: still in 2F Player's House (went *up* the stairs
  # instead of down), no Pokemon, no badges, no map memory written.
  # 14/20 grade=true (70%) is misleading — the model gets a high self-
  # grade by predicting conservatively ("I'll still be in this room")
  # and trivially matching the screen. Compare: Gemini 3.1 Pro (medium)
  # had 45% grade rate on the same task but reached Oak's Lab and got
  # Charmander as starter.
  #
  # Cost-per-turn $0.0298 (~2× Pro low's $0.0158), latency 13.9s, output
  # 553 tokens/turn — terse reasoning, not enough exploration.
  #
  # Verdict: do not use grade rate to compare models in this project.
  # Real benchmark is in-game state at end of run (see project memory:
  # feedback_pokemon-success-metric).
  openrouter_id: "openai/gpt-5.5"
  reasoning:
    effort: "medium"
  observed:
    avg_turn_cost_usd: 0.0298
    avg_turn_latency_s: 13.9
    sample_turns: 20
    last_updated: 2026-05-01
    notes: "Stuck on 2F Player's House at run end (went UP instead of DOWN). High grade rate (70%) was self-grade gaming, not progress. Worse than Gemini Pro (medium) on actual game state."

# --- Moonshot AI Kimi K2.6 ---
# Multimodal flagship from Moonshot, 262K context, $0.74/$3.49 per M (mid-tier
# — between MiMo V2.5 and Qwen3.6-Plus). Binary thinking toggle, no effort
# tiers — Kimi falls in the same family as MiMo / Gemma / Qwen on OpenRouter
# (effort-tier docs explicitly list only OpenAI + Grok as effort-tiered;
# everyone else is binary or max_tokens-based).
#
# Image input: marketed as "multimodal" / "visual coding capability" by
# Moonshot. Not 100% confirmed safe with our default vision_mode:
# direct_multimodal yet — if it 404s like mimo-v2.5-pro did, fall back to
# vision_mode: separate_vlm.
#
# Sampling: 0.3 / 0.95, matching the function-call profile used elsewhere
# in this registry for reasoning models with structured-output schemas.
"kimi-k2.6(thinking)":
  # Observed (2026-05-01, aborted after 2T due to extreme latency): T1 took
  # 134.5s, T2 took 110.3s — slowest model in the registry by a wide margin
  # (worse than Grok 4.3's 71s avg). Cost is cheap ($0.012/turn, 3K input,
  # 2K output) and multimodal works (T1 graded null normally, no 404), but
  # the wall-clock cost makes 20T+ runs impractical at ~35-45min. Throughput
  # sort (provider.sort: "throughput") did NOT help — likely because all
  # Kimi K2.6 providers on OpenRouter are slow, not because the routing
  # field was ignored (config.py confirmed it resolved correctly). If you
  # need Kimi for this project, expect long wait times regardless of sort.
  openrouter_id: "moonshotai/kimi-k2.6"
  reasoning:
    enabled: true
  temperature: 0.3
  top_p: 0.95
  observed:
    sample_turns: 0
    notes: "Aborted across 3 attempts. With provider.sort=throughput: T1-T3 latencies 47s/224s/458s and 134s/110s (T1-T2). With default routing: 60s/214s/182s. Pattern is identical regardless of sort — reasoning length grows when prior turns exist (T1 ~700-900 output tokens, T2-T3 3000-9000+). Latency tracks output tokens, so routing can't fix it. Conclusion: Kimi K2.6 not viable for this project's loop until reasoning verbosity is bounded."

"kimi-k2.6(non-thinking)":
  openrouter_id: "moonshotai/kimi-k2.6"
  reasoning:
    enabled: false
  temperature: 0.3
  top_p: 0.95
  observed:
    sample_turns: 0

"gpt-5.4-nano(xhigh)":
  # Cheap-at-scale OpenAI nano. 400K context (smaller than the rest of the
  # registry), $0.20/$1.25 per M. xhigh effort = ~95% of max_tokens for
  # reasoning — pushing a small model to its reasoning ceiling. Interesting
  # comparison point for "do small reasoning models with max effort beat
  # large models with low effort?". If it works, it's the cheapest entry
  # in the registry for this task; if it doesn't, the ceiling is too low.
  openrouter_id: "openai/gpt-5.4-nano"
  reasoning:
    effort: "xhigh"
  observed:
    sample_turns: 0
