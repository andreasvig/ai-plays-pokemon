  # retries are factored in. Spatial reasoning was weak — agent stayed stuck
  # in/near the bedroom across 14 turns, similar failure mode to Flash Lite high.
  openrouter_id: "qwen/qwen3.6-plus"
  reasoning:
    enabled: true
  output_mode: "prompted"
  temperature: 0.3
  top_p: 0.95
  observed:
