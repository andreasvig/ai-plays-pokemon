# --- Google Gemma 4 31B IT ---
# Open-weights dense reasoning model, AA Intelligence 39, 262k context,
# $0.13/$0.38 per M (cheapest reasoning entry). Binary thinking toggle
# only — no effort tiers in Gemma 4's native chat template (confirmed
# from ai.google.dev/gemma/docs/capabilities/thinking, 2026-04-24).
# Full agent kit on OpenRouter: tools, tool_choice, structured_outputs,
# response_format all supported.
#
# Caveat: Google docs warn that reasoning_content must be preserved
# across multi-turn tool calls — Pydantic AI does this by default via
# message history, but worth knowing if validation retries misbehave.
# Throughput sort + prompted output: 10 providers list this model on
# OpenRouter (DeepInfra ×2, Chutes, Ambient, SiliconFlow, Novita, Parasail,
# Venice, Together ×2) with mixed capability sets — some are missing
# tools/tool_choice/structured_outputs, one Together endpoint is 32K
# context. `provider.sort: "throughput"` makes the router pick the fastest
# at request time, which can land on any of them. `output_mode: "prompted"`
# bypasses the tool_choice/structured_outputs surface entirely (schema in
# system prompt + client-side JSON parse), guaranteeing the request works
# regardless of which provider throughput-sort selects.
#
# Direct API probe (2026-05-22) verified that effort tiers
# (high/medium/low/minimal) do NOT discriminate budget on Gemma 4:
# reasoning_tokens varied non-monotonically across tiers (low: 420,
# medium: 275, high: 213) — pure provider-routing noise, not a real
# effort knob. Only `enabled: true|false` actually changes behavior.
# Stick with the binary toggle.
"gemma-4-31b(thinking)":
  openrouter_id: "google/gemma-4-31b-it"
  reasoning:
    enabled: true
  temperature: 0.3
  top_p: 0.95
  # provider.sort: "throughput" — verified 2026-05-22 via scripts/probe_throughput.py
  # (24 direct OpenRouter calls, all succeeded). Throughput-sort lands on
  # {Ambient, Novita, Together, Chutes} for multimodal requests. OpenRouter
  # auto-narrows to image-capable providers before applying the sort. The
  # prior 2026-05-22 attempt that crashed with `finish_reason: null` is no
  # longer reproducible — either the offending provider was demoted from
  # the pool or the upstream bug was fixed.
  #
  # Latency picture is wider than the probe suggests though. Probe (small
  # 288-token request) average per provider:
  #   - Novita:    ~4.8s    (fastest)
  #   - Ambient:   ~5.1s
  #   - Together:  ~16.8s
  #   - Chutes:    ~22.4s
  # In the real agent loop (3800-tok input, 400-1300 tok output) the slow
  # providers blow up: 3T agent verification 2026-05-22 ran
  # 26.7s/114.8s/150.1s (avg 97.2s) — best case is 3× better than default
  # routing's 89.9s but the slow tail makes avg comparable. Tightening to
  # provider.order=[Novita, Ambient] would pin to the fast pair; accepted
  # the variance for now since the goal was "fix the crash", not "minimize
  # latency". Revisit if a long benchmark needs predictable throughput.
  provider:
    sort: "throughput"
  output_mode: "prompted"
  observed:
    avg_turn_cost_usd: 0.0015
    avg_turn_latency_s: 97.2
    sample_turns: 3
    last_updated: 2026-05-22
    notes: "Throughput-sort verified 2026-05-22 (24 probe calls + 3T agent run, all clean). Latency variance 26-150s/turn — best case 3× better than 2026-04-24 default-routing's 89.9s, but worst case (Chutes/Together) drags the average back to par. T1 picked fast provider (26.7s/384 out tokens), T2-T3 picked slow providers (114s/150s @ 1343/1228 out tokens). Provider name surfaces in turn output via pydantic-ai model_name fallback (e.g. 'google/gemma-4-31b-it-20260402') — the actual OpenRouter provider isn't directly exposed through msg.provider_details."

"gemma-4-31b(non-thinking)":
  openrouter_id: "google/gemma-4-31b-it"
  reasoning:
    enabled: false
  temperature: 0.3
  top_p: 0.95
  output_mode: "prompted"
  observed:
    sample_turns: 0

# --- Google Gemma 4 26B A4B IT (added 2026-05-22) ---
# Already used as the OCR cleanup model project-wide (every config 2.x+ sets
# `ocr.cleanup_model: "google/gemma-4-26b-a4b-it"`). Adding agent-side
# aliases so we can probe whether the A4B variant is faster or sharper than
# the 31B as the main reasoning LLM.
#
# Specs: 30B-class active-routing dense model, 262K context, $0.07/$0.34
# per M on cheapest provider (DekaLLM) — half the 31B's price floor. Same
# multimodal envelope (text + image + video → text).
#
# Provider stack: 6+ providers on OpenRouter (DekaLLM, DeepInfra, Cloudflare,
# SiliconFlow, Parasail, Novita) with mixed capability sets — DekaLLM has
# no tools/tool_choice/structured_outputs at all (only response_format-less
# base), while DeepInfra/Cloudflare/Novita have the full tool stack. Same
# pattern as 31B: `provider.sort: "throughput"` + `output_mode: "prompted"`
# gives a setup that works regardless of which provider the router picks.
#
# Reasoning shape: same binary toggle as 31B (confirmed Gemma family-wide
# from ai.google.dev/gemma/docs/capabilities/thinking — `enable_thinking`
# is a single boolean, no effort tiers, no numeric budget). Sampling 0.3/0.95
# matches the function-call profile used for all other reasoning models in
# this registry.
"gemma-4-26b-a4b(thinking)":
  openrouter_id: "google/gemma-4-26b-a4b-it"
  reasoning:
    enabled: true
  temperature: 0.3
  top_p: 0.95
  # No `provider` block on purpose — see the gemma-4-31b(thinking) note.
  # Confirmed multimodal-capable providers (from a 2026-05-22 error trace
  # with image input): dekallm, siliconflow, parasail, novita, nextbit,
  # google-vertex, venice. Cloudflare is text-only for this model and gets
  # filtered out automatically when images are present.
  output_mode: "prompted"
  observed:
    sample_turns: 0

"gemma-4-26b-a4b(non-thinking)":
  openrouter_id: "google/gemma-4-26b-a4b-it"
  reasoning:
    enabled: false
  temperature: 0.3
  top_p: 0.95
  output_mode: "prompted"
  observed:
    sample_turns: 0

# --- Alibaba Qwen3.6-Plus ---
# Hybrid linear-attention + sparse MoE. AA Intelligence 50, 1M context,
# $0.325/$1.95 per M on OpenRouter (cheaper than AA's listed $0.50/$3.00).
# Text + image + video input (AA confirms multimodal — safe for our default
# vision_mode: direct_multimodal, unlike MiMo V2.5 Pro).
#
# Thinking controls: native API is BINARY (enable_thinking boolean) plus
# optional thinking_budget integer. No native effort tiers. OpenRouter accepts
# reasoning.effort and normalizes to thinking_budget under the hood, but we
# stick with the binary convention for parity with MiMo V2.5 / Gemma 4.
#
# Cost caveat: AA flags this model as "very verbose" — 100M output tokens
# during their eval vs 35M median for peers. On an agent loop that already
# produces long structured outputs, this will inflate turn cost beyond what
# the $/M pricing suggests. Watch avg_turn_cost_usd closely after first run.
#
# Sampling: Qwen's general-purpose recs are 0.6/0.95 (thinking) and 0.7/0.8
# (non-thinking). We use 0.3/0.95 to match the structured-output / function-
# call profile used elsewhere in this registry (MiMo, Gemma). Reconsider if
# early runs feel too deterministic or miss good actions.
# Qwen3.6-Plus needs output_mode: "prompted". Two layers of "no":
#   1. OpenRouter providers fronting qwen/qwen3.6-plus don't support
#      tool_choice (verified 2026-04-25, 404 "No endpoints found that
#      support the provided 'tool_choice' value") — rules out output_type=GameAction.
#   2. Pydantic AI's model profile for this model doesn't declare
#      supports_json_schema_output: true, so NativeOutput(GameAction) is
#      rejected client-side ("Native structured output is not supported by
#      the model"). Could be patched via custom ModelProfile but that's
#      brittle to maintain per-model.
# PromptedOutput injects the schema into the system prompt and parses the
# model's JSON text client-side — works for any model. Reasoning models
# like Qwen3.6-Plus (AA 50) are reliable at producing well-formed JSON
# under PromptedOutput. See src/agent/agent.py output_mode branching.
"qwen3.6-plus(thinking)":
  # Observed behaviour (2026-04-25, partial 15T run aborted at turn 14): cheaper
  # per-turn than Gemini 3 Flash high ($0.0069 vs $0.0090) and similar latency
