  reasoning_type: binary
  thinking_levels:
  - thinking
  - non-thinking
  output_mode: prompted
  temperature: 0.3
  top_p: 0.95
  provider:
    sort: throughput
  slow:
    thinking: true
  observed:
    thinking:
      avg_turn_cost_usd: 0.0013
      avg_turn_latency_s: 74.9
      sample_turns: 46
      last_updated: 2026-05-22
      notes: '50T attempt 2026-05-22 PRE-retry-fix: 46/50 turns then crashed at T47 with NoneType subscript (wrapped-5xx). Cost $0.0584 / 46 turns / $0.0013/turn — cheapest model in the registry by 10×. Turn-to-turn wall: median 55.6s, mean 74.9s, range 8.9-220.9s. 49% LLM self-grade true-rate (22/23/1). Game progress: got Bulbasaur lvl 5, exited bedroom + lab, dialogue-looped by Oak''s wild-Pokemon warning, never exited Pallet Town. Slow-tail providers (Chutes/Together) drag mean up; T19=220.9s, T46=208.4s. The retry-with-timeout layer in src/agent/turn.py (60s/60s/180s) was added after this run to survive the wrapped-5xx case — would have recovered T47. Provider name surfaces in turn output via pydantic-ai model_name fallback (''google/gemma-4-31b-it-20260402'') — actual OpenRouter provider not exposed via msg.provider_details.'
    non-thinking:
      sample_turns: 0

