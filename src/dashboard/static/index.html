<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Plays Pokemon</title>
<style>
  :root {
    --bg: #0d1117;
    --bg-panel: #161b22;
    --bg-card: #1c2333;
    --border: #30363d;
    --text: #e6edf3;
    --text-dim: #8b949e;
    --accent: #53d8fb;
    --accent2: #e94560;
    --green: #3fb950;
    --yellow: #d29922;
    --purple: #bc8cff;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Menlo', 'Monaco', 'Courier New', monospace;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* Header */
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 16px;
    background: var(--bg-panel);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .header-title {
    font-size: 16px;
    font-weight: bold;
    color: var(--accent);
  }
  .header-task {
    font-size: 13px;
    color: var(--text);
    flex: 1;
    margin: 0 20px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .header-stats {
    display: flex;
    gap: 16px;
    font-size: 12px;
    color: var(--text-dim);
    flex-shrink: 0;
  }
  .stat-value { color: var(--accent); font-weight: bold; }

  /* Main layout */
  .main {
    display: flex;
    flex: 1;
    overflow: hidden;
  }

  /* Chat panel (left) */
  .chat-panel {
    width: 55%;
    display: flex;
    flex-direction: column;
    border-right: 1px solid var(--border);
  }
  .chat-scroll {
    flex: 1;
    overflow-y: auto;
    padding: 8px;
  }
  .chat-scroll::-webkit-scrollbar { width: 6px; }
  .chat-scroll::-webkit-scrollbar-track { background: var(--bg); }
  .chat-scroll::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  /* Right panel */
  .right-panel {
    width: 45%;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* Screen area */
  .screen-area {
    padding: 12px;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #000;
    border-bottom: 1px solid var(--border);
  }
  .screen-area img {
    image-rendering: pixelated;
    max-width: 100%;
    max-height: 100%;
    border: 2px solid var(--border);
  }

  /* State area — shares the space below the screen 50/50 with the Current Task
     panel; min-height:0 lets it actually shrink so its own scrollbar engages. */
  .state-area {
    flex: 1 1 0;
    min-height: 0;
    overflow-y: auto;
    padding: 12px;
  }
  .state-area::-webkit-scrollbar { width: 6px; }
  .state-area::-webkit-scrollbar-track { background: var(--bg); }
  .state-area::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  .state-header {
    font-size: 12px;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 8px;
  }

  /* Current Task panel — pinned below the Memory Dictionary so the active
     task's description + requirements are always visible without scrolling
     the chat. Amber to match the master/task accent. */
  .task-panel {
    flex: 1 1 0;
    min-height: 0;
    overflow-y: auto;
    padding: 12px;
    border-top: 2px solid var(--border);
    border-left: 3px solid #ffce54;
    background: rgba(255, 206, 84, 0.05);
  }
  .task-panel::-webkit-scrollbar { width: 6px; }
  .task-panel::-webkit-scrollbar-track { background: var(--bg); }
  .task-panel::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  .task-panel-header {
    font-size: 12px;
    color: #ffce54;
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 8px;
    font-weight: bold;
  }
  .task-panel-title {
    font-size: 13px;
    font-weight: bold;
    color: var(--text);
    margin-bottom: 8px;
    line-height: 1.4;
  }
  .task-panel-label {
    display: block;
    font-size: 10px;
    font-weight: bold;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: #ffce54;
    margin: 8px 0 2px;
  }
  .task-panel-desc {
    font-size: 12px;
    color: var(--text);
    line-height: 1.5;
    white-space: pre-wrap;
  }
  .task-panel-crit {
    font-size: 12px;
    color: var(--text-dim);
    line-height: 1.5;
    white-space: pre-wrap;
  }
  .task-panel-empty { font-size: 12px; color: var(--text-dim); }

  /* Footer */
  .footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 6px 16px;
    background: var(--bg-panel);
    border-top: 1px solid var(--border);
    font-size: 11px;
    color: var(--text-dim);
    flex-shrink: 0;
  }
  .footer .connected { color: var(--green); }
  .footer .disconnected { color: var(--accent2); }

  /* ============================================================
     TaskMaster two-level tree — design tokens (keep in sync with
     report.py <style>; Decision 7):
       task accent / amber-gold : #ffce54
       badge ✅ succeeded       : #7ddf64
       badge ❌ failed          : #e94560
       badge 🟡 partial         : #ffce54
       badge ⏳ current/pending  : grey (#8b949e)
       player turn guide line   : #2a3a5a, indent 24px
     ============================================================ */
  .task-group {
    margin-bottom: 8px;
    border: 1px solid var(--border);
    border-left: 3px solid #ffce54;
    border-radius: 4px;
    background: var(--bg-panel);
  }
  .task-header {
    padding: 8px 10px;
    cursor: pointer;
    user-select: none;
    background: rgba(255, 206, 84, 0.08);
    border-bottom: 1px solid transparent;
  }
  .task-header:hover { background: rgba(255, 206, 84, 0.14); }
  .task-group.open .task-header { border-bottom-color: var(--border); }
  .task-header-row {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
  }
  .task-arrow {
    font-size: 10px;
    color: #ffce54;
    transition: transform 0.15s;
    width: 12px;
    flex-shrink: 0;
  }
  .task-group.open .task-arrow { transform: rotate(90deg); }
  .task-label { color: #ffce54; font-weight: bold; flex-shrink: 0; }
  .task-title {
    color: var(--text);
    font-weight: bold;
    flex: 1;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .task-count { color: var(--text-dim); font-size: 11px; flex-shrink: 0; }
  .task-cost { color: var(--yellow); font-size: 11px; flex-shrink: 0; }
  .task-badge {
    flex-shrink: 0;
    font-size: 11px;
    font-weight: bold;
    padding: 1px 7px;
    border-radius: 10px;
    border: 1px solid currentColor;
  }
  .task-badge.badge-succeeded { color: #7ddf64; }
  .task-badge.badge-failed { color: #e94560; }
  .task-badge.badge-partial { color: #ffce54; }
  .task-badge.badge-other { color: #bc8cff; }
  .task-badge.badge-pending { color: var(--text-dim); }
  /* Description line: always visible even when collapsed (Decision 4) */
  .task-desc {
    margin-top: 4px;
    padding-left: 20px;
    color: var(--text-dim);
    font-size: 12px;
    line-height: 1.4;
  }
  .task-body {
    display: none;
    padding: 8px 10px;
  }
  .task-group.open .task-body { display: block; }
  /* Master detail block — amber "strategy" layer, full width */
  .master-block {
    margin-bottom: 8px;
    border: 1px solid var(--border);
    border-left: 2px solid #ffce54;
    border-radius: 4px;
    background: var(--bg);
    overflow: hidden;
  }
  .master-block-header {
    padding: 4px 10px;
    font-size: 11px;
    font-weight: bold;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    background: rgba(255, 206, 84, 0.12);
    color: #ffce54;
    border-bottom: 1px solid var(--border);
  }
  .master-block-body { padding: 6px 10px; }
  .master-verdict {
    margin-bottom: 8px;
    padding: 6px 8px;
    border-radius: 4px;
    background: var(--bg-card);
    font-size: 12px;
    line-height: 1.5;
  }
  .master-criteria {
    margin-bottom: 8px;
    color: var(--text-dim);
    font-size: 11px;
    line-height: 1.5;
  }
  /* Player's hand-back, shown above the Master's verdict in the verdict box */
  .player-handback {
    margin-bottom: 8px;
    padding-bottom: 8px;
    border-bottom: 1px dashed var(--border);
    color: var(--text);
  }
  .player-handback .master-card-label { color: #6ca4ff; }
  /* Structured master "decision card" — the master's output in labeled rows */
  .master-card {
    margin-bottom: 8px;
    padding: 8px 10px;
    border-radius: 4px;
    background: var(--bg-card);
    border: 1px solid var(--border);
  }
  .master-card-row { margin-bottom: 8px; font-size: 12px; line-height: 1.55; color: var(--text); }
  .master-card-row:last-child { margin-bottom: 0; }
  .master-card-label {
    display: block;
    font-size: 10px;
    font-weight: bold;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: #ffce54;
    margin-bottom: 2px;
  }
  .master-card-desc { white-space: pre-wrap; }
  .master-card .master-verdict { margin-bottom: 0; }
  /* The master's output card (task + rating), pinned at the bottom of the block */
  .master-output { margin-top: 10px; margin-bottom: 0; }
  /* Screenshots the master actually saw, shown under its Input tab */
  .master-thumbs { display: flex; gap: 8px; margin: 6px 0; flex-wrap: wrap; }
  .master-thumb { margin: 0; text-align: center; }
  .master-thumb img { width: 140px; image-rendering: pixelated; border: 1px solid var(--border); border-radius: 4px; display: block; }
  .master-thumb figcaption { font-size: 10px; color: #ffce54; text-transform: uppercase; letter-spacing: 0.5px; margin-top: 3px; }
  /* Player turns nested under their task with a guide line */
  .task-turns {
    margin-left: 24px;
    border-left: 2px solid #2a3a5a;
    padding-left: 8px;
  }

  /* Turn blocks */
  .turn-block {
    margin-bottom: 4px;
    border: 1px solid var(--border);
    border-radius: 4px;
    background: var(--bg-panel);
  }
  .turn-block.active {
    border-color: var(--accent);
  }
  .turn-header {
    padding: 6px 10px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    user-select: none;
  }
  .turn-header:hover { background: var(--bg-card); }
  .turn-arrow {
    font-size: 10px;
    color: var(--text-dim);
    transition: transform 0.15s;
    width: 12px;
  }
  .turn-block.open .turn-arrow { transform: rotate(90deg); }
  .turn-label { color: var(--accent); font-weight: bold; }
  .turn-summary { color: var(--text-dim); flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .turn-cost { color: var(--yellow); font-size: 11px; }
  .turn-body {
    display: none;
    padding: 4px 10px 8px 30px;
    font-size: 12px;
    line-height: 1.5;
  }
  .turn-block.open .turn-body { display: block; }

  /* Chat entries */
  .chat-entry {
    margin: 2px 0;
    padding: 2px 0;
  }
  /* Boxed entry sections */
  .entry-box {
    margin: 6px 0;
    border: 1px solid var(--border);
    border-radius: 4px;
    background: var(--bg);
    overflow: hidden;
  }
  .entry-box-header {
    padding: 4px 10px;
    font-size: 11px;
    font-weight: bold;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    border-bottom: 1px solid var(--border);
  }
  .entry-box-body {
    padding: 8px 10px;
    font-size: 12px;
    line-height: 1.6;
    white-space: pre-wrap;
  }
  .entry-box-body strong {
    font-weight: bold;
    display: block;
    margin-top: 8px;
  }

  /* Box color variants */
  .box-vision .entry-box-header { background: #0d2818; color: var(--green); }
  .box-vision .entry-box-body { color: var(--green); }
  .box-thinking .entry-box-header { background: #1a1028; color: var(--purple); }
  .box-thinking .entry-box-body { color: #c9b0e8; }
  .box-thinking .entry-box-body strong { color: #d2a8ff; }
  .box-output .entry-box-header { background: #0a1929; color: var(--accent); }
  .box-output .entry-box-body { color: var(--text); }
  .box-action .entry-box-header { background: #290a14; color: var(--accent2); }
  .box-action .entry-box-body { color: var(--accent2); font-weight: bold; font-size: 14px; }
  .box-tool .entry-box-header { background: #1a1508; color: var(--yellow); }
  .box-tool .entry-box-body { color: var(--text-dim); font-size: 11px; }
  .box-memory .entry-box-header { background: #0a1a0a; color: #7ddf64; }
  .box-memory .entry-box-body { color: #7ddf64; font-size: 12px; white-space: pre-wrap; font-family: 'SF Mono', monospace; }
  .box-handback .entry-box-header { background: #0a1929; color: #6ca4ff; }
  .box-handback .entry-box-body { color: #aacbff; }
  .box-ocr .entry-box-header { background: #2a1a05; color: #ffb454; }
  .box-ocr .entry-box-body { color: #ffb454; font-size: 12px; white-space: pre-wrap; font-family: 'SF Mono', monospace; }
  .box-ocr .entry-box-body details { margin-top: 6px; }
  .box-ocr .entry-box-body details summary { cursor: pointer; color: #c98a3e; font-size: 11px; }
  .box-ocr .entry-box-body details pre { margin-top: 4px; color: #c98a3e; font-size: 11px; }
  .box-error .entry-box-header { background: #290a0a; color: var(--accent2); }
  .box-settle .entry-box-header { background: #1a1500; color: #e2a93b; }
  .box-settle .entry-box-body { color: #e2a93b; font-size: 12px; }
  .box-error .entry-box-body { color: var(--accent2); }

  .entry-system {
    color: var(--text-dim);
    font-size: 11px;
  }

  /* JSON tree */
  .json-tree { font-size: 12px; line-height: 1.6; }
  .json-key { color: var(--accent); }
  .json-string { color: var(--green); }
  .json-number { color: var(--yellow); }
  .json-bool { color: var(--purple); }
  .json-null { color: var(--text-dim); }
  .json-bracket { color: var(--text-dim); }
  .json-toggle {
    cursor: pointer;
    user-select: none;
    color: var(--text-dim);
  }
  .json-toggle:hover { color: var(--text); }
  .json-children { padding-left: 16px; }
  .json-hidden { display: none; }

  /* Connection banner */
  .reconnecting {
    background: var(--accent2);
    color: white;
    text-align: center;
    padding: 4px;
    font-size: 11px;
    display: none;
  }
  .reconnecting.show { display: block; }

  /* Referee benchmark HUD (Phase 6) */
  #referee-hud { flex-shrink: 0; }
  .referee-strip {
    padding: 6px 12px;
    font-size: 12px;
    font-weight: bold;
    cursor: pointer;
    border-bottom: 1px solid var(--border);
    background: var(--bg-card);
    color: var(--text);
    user-select: none;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .referee-strip::before { content: '🏁'; }
  .referee-strip.neutral { color: var(--text); }
  .referee-strip.amber   { color: var(--yellow); }
  .referee-strip.red     { color: var(--accent2); }
  .referee-strip.missed {
    background: var(--accent2);
    color: white;
  }
  .referee-strip.observed { color: var(--text-dim); }
  .referee-panel {
    padding: 8px 12px;
    font-size: 11px;
    background: var(--bg-panel);
    border-bottom: 1px solid var(--border);
    max-height: 220px;
    overflow-y: auto;
  }
  .referee-section { margin-bottom: 8px; }
  .referee-section-title {
    color: var(--accent);
    font-weight: bold;
    margin-bottom: 3px;
    text-transform: uppercase;
    font-size: 10px;
    letter-spacing: 0.5px;
  }
  .referee-row { padding: 1px 0; color: var(--text-dim); }
  .referee-row.done { color: var(--green); }
  .referee-row.current { color: var(--text); font-weight: bold; }
  /* Gate ladder rendered as a table */
  .referee-table { width: 100%; border-collapse: collapse; font-size: 11px; }
  .referee-table th {
    text-align: left;
    color: var(--text-dim);
    font-weight: normal;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    border-bottom: 1px solid var(--border);
    padding: 2px 6px;
  }
  .referee-table td { padding: 2px 6px; vertical-align: top; }
  .referee-table th:nth-child(2), .referee-table td:nth-child(2),
  .referee-table th:nth-child(3), .referee-table td:nth-child(3) {
    text-align: right; white-space: nowrap; color: var(--text-dim);
  }
  .referee-grouphdr td {
    color: var(--accent);
    font-weight: bold;
    text-transform: uppercase;
    font-size: 10px;
    letter-spacing: 0.5px;
    padding-top: 6px;
  }
  .referee-trow.done td:first-child { color: var(--green); }
  .referee-trow.current td { color: var(--text); font-weight: bold; }
  .referee-trow.missed td { color: var(--accent2); font-weight: bold; }
  .referee-empty { color: var(--text-dim); }
</style>
</head>
<body>

<div class="reconnecting" id="reconnectBanner">Reconnecting...</div>

<div class="header">
  <div class="header-title">AI Plays Pokemon</div>
  <div class="header-task" id="taskLabel">Loading...</div>
  <div class="header-stats">
    <span>Cost: <span class="stat-value" id="statCost">$0.00</span></span>
    <span>Turn: <span class="stat-value" id="statTurn">0</span></span>
    <span>Tokens: <span class="stat-value" id="statTokens">0/0</span></span>
  </div>
</div>

<div class="main">
  <div class="chat-panel">
    <div class="chat-scroll" id="chatScroll"></div>
  </div>
  <div class="right-panel">
    <div id="referee-hud" style="display:none">
      <div id="referee-strip" class="referee-strip" title="Click to expand the gate ladder"></div>
      <div id="referee-panel" class="referee-panel" style="display:none"></div>
    </div>
    <div class="screen-area">
      <img id="screen" alt="GBA Screen" width="720" height="480" />
    </div>
    <div class="state-area">
      <div class="state-header">Memory Dictionary</div>
      <div class="json-tree" id="stateTree">Waiting for data...</div>
    </div>
    <div class="task-panel">
      <div class="task-panel-header">🧭 Current Task</div>
      <div id="currentTaskPanel">
        <div class="task-panel-empty">No task yet.</div>
      </div>
    </div>
  </div>
</div>

<div class="footer">
  <span>
    Screen: <span id="screenStatus" class="disconnected">disconnected</span> |
    Events: <span id="eventsStatus" class="disconnected">disconnected</span>
  </span>
  <span id="footerModel">Model: —</span>
  <span id="footerEvents">Events: 0</span>
</div>

<script>
// --- Run prefix (dynamic routing) ---
// Pages live at /runs/{run_id}; api + ws routes are scoped under that prefix.
// When served from /current, the server injects RUN_PREFIX_OVERRIDE so the
// inner calls still target /runs/<latest_id> while the URL bar stays /current.
// Strip a trailing slash so we end up with e.g. "/runs/abc".
const RUN_PREFIX = window.RUN_PREFIX_OVERRIDE || location.pathname.replace(/\/$/, '');

// --- State ---
const state = {
  currentTurn: 0,
  eventCount: 0,
  userScrolled: false,
  screenConnected: false,
  eventsConnected: false,
};

const chatScroll = document.getElementById('chatScroll');
const screenImg = document.getElementById('screen');
let currentTurnBlock = null;
let currentTurnBody = null;
let prevObjectURL = null;

// --- TaskMaster two-level tree state ---
// currentTaskGroup/Body point at the active .task-group; null in legacy
// (no task_started) runs, in which case turns stream flat into chatScroll.
// task_master_trace{N} arrives BEFORE task_started{N} (see plan event
// contract), so traces that land before their group exists are buffered
// here keyed by task_index and flushed when startNewTask creates the group.
let currentTaskGroup = null;
let currentTaskBody = null;
const pendingMasterTraces = {};

// --- Auto-scroll logic ---
chatScroll.addEventListener('scroll', () => {
  const atBottom = chatScroll.scrollTop + chatScroll.clientHeight >= chatScroll.scrollHeight - 60;
  state.userScrolled = !atBottom;
});

function autoScroll() {
  if (!state.userScrolled) {
    chatScroll.scrollTop = chatScroll.scrollHeight;
  }
}

// --- Referee benchmark HUD state (Phase 6) ---
// ladder: [{id, name, deadline_turn}] in order, served once by /api/config.
// stamps: {id: turn} latched append-only from referee_checkpoint events;
//   NEVER reset on socket reopen (cursor replay re-feeds the events → rebuilds).
// missed: {name, deadline_turn} once a gate-missed/terminate event arrives.
const referee = {
  ladder: null,
  enforce: false,
  stamps: {},
  missed: null,
};

function refereeFmtDeadline(d) {
  return (d === null || d === undefined) ? '—' : 'T' + d;
}

function renderReferee() {
  const hud = document.getElementById('referee-hud');
  if (!referee.ladder || !referee.ladder.length) {
    hud.style.display = 'none';
    return;
  }
  hud.style.display = '';
  const strip = document.getElementById('referee-strip');
  const now = state.currentTurn;

  // Missed-gate lock takes precedence over everything.
  if (referee.missed) {
    strip.className = 'referee-strip missed';
    strip.textContent =
      `Missed gate: ${referee.missed.name} (deadline ${refereeFmtDeadline(referee.missed.deadline_turn)})`;
  } else {
    // The next unmet gate is the first ladder entry not in stamps.
    const next = referee.ladder.find(cp => !(cp.id in referee.stamps));
    if (!next) {
      strip.className = 'referee-strip neutral';
      strip.textContent = 'All gates cleared';
    } else if (next.deadline_turn === null || next.deadline_turn === undefined) {
      // Only null-deadline gates (the un-enforced tail) are pure "observed".
      strip.className = 'referee-strip observed';
      strip.textContent = `Next gate: ${next.name} — observed only`;
    } else {
      // A numeric limit always shows the countdown — even in observe mode
      // (enforce=false), where it's a pace indicator that doesn't terminate.
      const left = next.deadline_turn - now;
      // Color by remaining budget. Anchor the budget on the previous gate's
      // deadline (or 0) so "fraction left" is window-relative, not absolute.
      const prevDeadline = (() => {
        let prev = 0;
        for (const cp of referee.ladder) {
          if (cp.id === next.id) break;
          if (typeof cp.deadline_turn === 'number') prev = cp.deadline_turn;
        }
        return prev;
      })();
      const windowSize = Math.max(1, next.deadline_turn - prevDeadline);
      const frac = left / windowSize;
      let cls = 'neutral';
      if (frac < 0.10) cls = 'red';
      else if (frac < 0.25) cls = 'amber';
      strip.className = 'referee-strip ' + cls;
      const tag = referee.enforce ? '' : ' · observe';
      strip.textContent =
        `Next gate: ${next.name} — ${left} turns left (limit T${next.deadline_turn}, now T${now})${tag}`;
    }
  }

  renderRefereePanel();
}

function renderRefereePanel() {
  const panel = document.getElementById('referee-panel');
  if (panel.style.display === 'none') return;  // only build when expanded
  const now = state.currentTurn;
  const completed = [];
  const upcoming = [];
  let current = null;
  for (const cp of referee.ladder) {
    if (cp.id in referee.stamps) {
      completed.push(cp);
    } else if (current === null) {
      current = cp;
    } else {
      upcoming.push(cp);
    }
  }

  const esc = s => String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
  const fmtLimit = cp => refereeFmtDeadline(cp.deadline_turn);
  const groupHdr = label => `<tr class="referee-grouphdr"><td colspan="3">${label}</td></tr>`;
  const empty = txt => `<tr class="referee-trow"><td colspan="3" class="referee-empty">${txt}</td></tr>`;
  const rows = [];

  // Completed: gate · first-seen turn · limit
  rows.push(groupHdr(`Completed (${completed.length})`));
  if (completed.length) {
    for (const cp of completed) {
      rows.push(
        `<tr class="referee-trow done"><td>✓ ${esc(cp.name)}</td>` +
        `<td>T${referee.stamps[cp.id]}</td><td>${fmtLimit(cp)}</td></tr>`);
    }
  } else { rows.push(empty('—')); }

  // Current: gate · turns-left (or observed) · limit
  rows.push(groupHdr('Current'));
  if (referee.missed) {
    rows.push(
      `<tr class="referee-trow missed"><td>✗ ${esc(referee.missed.name)}</td>` +
      `<td>missed</td><td>${refereeFmtDeadline(referee.missed.deadline_turn)}</td></tr>`);
  } else if (current) {
    let turnsCell;
    if (current.deadline_turn === null || current.deadline_turn === undefined) {
      turnsCell = 'observed';
    } else {
      turnsCell = `${current.deadline_turn - now} left (now T${now})`;
    }
    rows.push(
      `<tr class="referee-trow current"><td>▶ ${esc(current.name)}</td>` +
      `<td>${turnsCell}</td><td>${fmtLimit(current)}</td></tr>`);
  } else { rows.push(empty('all gates cleared')); }

  // Upcoming: gate · — · limit
  rows.push(groupHdr(`Upcoming (${upcoming.length})`));
  if (upcoming.length) {
    for (const cp of upcoming) {
      rows.push(
        `<tr class="referee-trow"><td>${esc(cp.name)}</td><td></td><td>${fmtLimit(cp)}</td></tr>`);
    }
  } else { rows.push(empty('—')); }

  panel.innerHTML =
    `<table class="referee-table"><thead><tr><th>Gate</th><th>Turns</th><th>Limit</th></tr></thead>` +
    `<tbody>${rows.join('')}</tbody></table>`;
}

document.getElementById('referee-strip').addEventListener('click', () => {
  const panel = document.getElementById('referee-panel');
  const showing = panel.style.display !== 'none';
  panel.style.display = showing ? 'none' : '';
  if (!showing) renderRefereePanel();
});

// --- Screen WebSocket ---
function connectScreen() {
  const ws = new WebSocket(`ws://${location.host}${RUN_PREFIX}/ws/screen`);
  ws.binaryType = 'arraybuffer';

  ws.onopen = () => {
    state.screenConnected = true;
    updateStatus();
  };

  ws.onmessage = (e) => {
    const blob = new Blob([e.data], { type: 'image/png' });
    const url = URL.createObjectURL(blob);
    screenImg.src = url;
    if (prevObjectURL) URL.revokeObjectURL(prevObjectURL);
    prevObjectURL = url;
  };

  ws.onclose = (e) => {
    state.screenConnected = false;
    updateStatus();
    // Server sends 1008 only when the session is gone (run ended).
    // On /current view, reload so the server can pick the new latest run.
    // Elsewhere, keep reconnecting in case the WebSocket dropped transiently.
    if (e.code === 1008 && window.IS_CURRENT_VIEW) {
      location.reload();
    } else {
      setTimeout(connectScreen, 2000);
    }
  };

  ws.onerror = () => ws.close();
}

// --- Events WebSocket ---
function connectEvents() {
  const ws = new WebSocket(`ws://${location.host}${RUN_PREFIX}/ws/events`);

  ws.onopen = () => {
    state.eventsConnected = true;
    updateStatus();
    // The server replays the FULL event backlog from cursor 0 on every (re)connect
    // (see server.py ws_events). Reset the feed + grouping state so a transient
    // reconnect rebuilds cleanly instead of appending a second copy of every task
    // group / turn. On the first connect chatScroll is already empty (no-op).
    chatScroll.innerHTML = '';
    currentTaskGroup = null;
    currentTaskBody = null;
    currentTurnBlock = null;
    currentTurnBody = null;
    for (const k in pendingMasterTraces) delete pendingMasterTraces[k];
    state.eventCount = 0;
  };

  ws.onmessage = (e) => {
    const msg = JSON.parse(e.data);
    if (msg.type === 'event') handleEvent(msg.data);
    else if (msg.type === 'state_update') renderStateTree(msg.data);
    else if (msg.type === 'stats') updateStats(msg.data);
  };

  ws.onclose = (e) => {
    state.eventsConnected = false;
    updateStatus();
    if (e.code === 1008 && window.IS_CURRENT_VIEW) {
      location.reload();
    } else {
      setTimeout(connectEvents, 2000);
    }
  };

  ws.onerror = () => ws.close();
}

// --- Event handling ---
// Pull this master invocation's own rating_of_previous_task out of its trace —
// the chronologically-honest "result of the previous task" (null on cold start).
function masterRatingOfPrevious(messages) {
  for (const msg of (messages || [])) {
    const name = msg.tool_name;
    const role = msg.role || msg.kind;
    if (name === 'final_result' || role === 'final_result') {
      let a = msg.args;
      if (typeof a === 'string') { try { a = JSON.parse(a); } catch(e) { a = null; } }
      if (a && typeof a === 'object' && a.rating_of_previous_task) return a.rating_of_previous_task;
    }
  }
  return null;
}

const STATUS_GLYPH = { succeeded: '✅', failed: '❌', partial: '🟡', other: '➖' };

// Format the Player's return_to_taskmaster block for a turn card.
function fmtHandback(r) {
  if (!r || typeof r !== 'object') return '';
  const parts = [];
  if (r.self_assessment) parts.push('Self-assessment: ' + r.self_assessment);
  if (r.task_summary) parts.push('Task summary: ' + r.task_summary);
  return parts.join('\n\n');
}

function handleEvent(evt) {
  state.eventCount++;
  document.getElementById('footerEvents').textContent = 'Events: ' + state.eventCount;

  const t = evt.type;

  if (t === 'run_start') {
    addSystemEntry('Run started');
  }
  else if (t === 'task_started') {
    startNewTask(evt);
  }
  else if (t === 'task_master_trace') {
    renderMasterTrace(evt);
  }
  else if (t === 'task_completed') {
    completeTask(evt);
  }
  else if (t === 'turn_start') {
    if (typeof evt.turn === 'number') {
      state.currentTurn = evt.turn;
      if (referee.ladder) renderReferee();
    }
    startNewTurn(evt.turn);
  }
  else if (t === 'referee_checkpoint') {
    // Latch append-only: never overwrite an existing stamp, never un-stamp.
    // On reconnect the cursor replay re-feeds these → the latch rebuilds.
    // checkpoint_id (not id): the envelope reserves `id` for the event seq id.
    if (evt.checkpoint_id != null && !(evt.checkpoint_id in referee.stamps)) {
      referee.stamps[evt.checkpoint_id] = evt.turn;
    }
    if (referee.ladder) renderReferee();
  }
  else if (t === 'referee_gate_missed' || t === 'referee_terminate') {
    referee.missed = { name: evt.name || evt.checkpoint_id, deadline_turn: evt.deadline_turn };
    if (referee.ladder) renderReferee();
  }
  else if (t === 'turn_trace') {
    // turn_trace is the authoritative view of the turn — replace streaming entries
    // with the full trace including thinking (not available as individual events)
    renderTurnTrace(evt);
  }
  else if (t === 'turn_explanation') {
    renderTurnExplanation(evt);
  }
  else if (t === 'turn_usage') {
    renderTurnUsage(evt);
  }
  else if (t === 'llm_thinking') {
    addBox('thinking', '💭 Thinking', evt.content || '', true);
  }
  else if (t === 'llm_output') {
    let args = evt.args || '';
    if (typeof args === 'string') { try { args = JSON.parse(args); } catch(e) { console.error('llm_output parse fail', e); } }
    if (typeof args === 'object') {
      let lines = [];
      const grade = args.last_turn_succeeded;
      if (grade === true) lines.push('✅ Last turn: succeeded');
      else if (grade === false) lines.push('❌ Last turn: failed');
      else if (grade === null) lines.push('➖ Last turn: n/a (first turn)');
      if (args.reasoning) lines.push('🧠 ' + args.reasoning);
      if (lines.length) addBox('output', '💬 Output', lines.join('\n\n'));
      if (args.inputs && args.inputs.length) {
        const inputs = Array.isArray(args.inputs) ? JSON.stringify(args.inputs) : args.inputs;
        addBox('action', '🎮 Action', inputs);
      }
      if (args.return_to_taskmaster) addBox('handback', '↩️ Return to TaskMaster', fmtHandback(args.return_to_taskmaster));
    } else {
      console.error('llm_output args not object:', typeof args, args);
    }
  }
  else if (t === 'memory_update_output') {
    const raw = evt.content || '(no changes)';
    let display = raw;
    if (raw !== '(no changes)' && raw.toLowerCase() !== 'none') {
      try { display = JSON.stringify(JSON.parse(raw), null, 2); } catch(e) {}
    }
    addBox('memory', '🧠 Memory Update', display);
  }
  else if (t === 'ocr_flush') {
    renderOcrFlush(evt);
  }
  else if (t === 'llm_text') {
    addBox('output', '💬 Output', evt.content || '');
  }
  else if (t === 'tool_call') {
    addBox('tool', '🔧 ' + evt.tool, JSON.stringify(evt.args, null, 2));
  }
  else if (t === 'tool_response') {
    const resp = typeof evt.response === 'string' ? evt.response : JSON.stringify(evt.response, null, 2);
    addBox('tool', '↳ Response', resp);
  }
  else if (t === 'button_sequence') {
    // Skip — already shown via llm_output action
  }
  else if (t === 'screen_settling') {
    addBox('settle', '⏱ Screen Settling', '0.0s');
    // Find the body element we just created and start a live timer
    const boxes = (currentTurnBody || chatScroll).querySelectorAll('.box-settle .entry-box-body');
    const bodyEl = boxes[boxes.length - 1];
    if (bodyEl) {
      const start = Date.now();
      bodyEl._interval = setInterval(() => {
        bodyEl.textContent = ((Date.now() - start) / 1000).toFixed(1) + 's';
      }, 100);
    }
  }
  else if (t === 'screen_settled') {
    const boxes = (currentTurnBody || chatScroll).querySelectorAll('.box-settle .entry-box-body');
    const bodyEl = boxes[boxes.length - 1];
    if (bodyEl && bodyEl._interval) {
      clearInterval(bodyEl._interval);
    }
    if (bodyEl) {
      bodyEl.textContent = 'Settled in ' + (evt.duration || 0) + 's';
    }
  }
  else if (t === 'output_retry') {
    addBox('error', '🔄 Output Retry', evt.content || 'Validation failed — retrying.');
  }
  else if (t === 'agent_error' || t === 'action_error') {
    addBox('error', '❌ Error', evt.error || evt.message || JSON.stringify(evt));
  }
  else if (t === 'run_end') {
    addSystemEntry('Run ended.');
  }
  // screenshot, state_change, ocr, etc. — silently ignore
}

// --- TaskMaster tree helpers ---

function findTaskGroup(taskIndex) {
  return chatScroll.querySelector('.task-group[data-task="' + taskIndex + '"]');
}

const BADGE = {
  succeeded: { glyph: '✅', cls: 'badge-succeeded', label: 'succeeded' },
  failed:    { glyph: '❌', cls: 'badge-failed',    label: 'failed' },
  partial:   { glyph: '🟡', cls: 'badge-partial',   label: 'partial' },
  other:     { glyph: '➖', cls: 'badge-other',      label: 'other' },
};

// Keep the pinned "Current Task" side panel in sync with the latest task.
function updateCurrentTaskPanel(evt) {
  const el = document.getElementById('currentTaskPanel');
  if (!el) return;
  const title = evt.title || '(untitled task)';
  const desc = evt.description || '';
  const crit = evt.success_criteria || '';
  let html = '<div class="task-panel-title">Task ' + evt.task_index + ': ' + escapeHtml(title) + '</div>';
  if (desc) {
    html += '<span class="task-panel-label">Description</span>' +
      '<div class="task-panel-desc">' + escapeHtml(desc) + '</div>';
  }
  if (crit) {
    html += '<span class="task-panel-label">🎯 Requirements</span>' +
      '<div class="task-panel-crit">' + escapeHtml(crit) + '</div>';
  }
  el.innerHTML = html;
}

function startNewTask(evt) {
  const taskIndex = evt.task_index;
  updateCurrentTaskPanel(evt);

  // Replay/reconnect-safe: if this task group already exists, re-enter it instead
  // of creating a duplicate. Collapse the prior current group, re-open this one.
  const existing = findTaskGroup(taskIndex);
  if (existing) {
    if (currentTaskGroup && currentTaskGroup !== existing) {
      currentTaskGroup.classList.remove('open');
    }
    existing.classList.add('open');
    currentTaskGroup = existing;
    currentTaskBody = existing.querySelector('.task-turns');
    const pendingReentry = pendingMasterTraces[taskIndex];
    if (pendingReentry) {
      delete pendingMasterTraces[taskIndex];
      renderMasterTrace(pendingReentry);
    }
    autoScroll();
    return;
  }

  // Collapse the previous task group (Decision 6 — live view keeps only the
  // current task open; past tasks collapse to their always-visible header).
  if (currentTaskGroup) {
    currentTaskGroup.classList.remove('open');
  }

  const group = document.createElement('div');
  group.className = 'task-group open';
  group.dataset.task = taskIndex;

  const header = document.createElement('div');
  header.className = 'task-header';
  const titleText = evt.title || '(untitled task)';
  const descText = evt.description || '';
  header.innerHTML = `
    <div class="task-header-row">
      <span class="task-arrow">▶</span>
      <span class="task-label">Task ${taskIndex} (Master)</span>
      <span class="task-title">${escapeHtml(titleText)}</span>
      <span class="task-count">0 turns</span>
      <span class="task-cost"></span>
      <span class="task-badge badge-pending">⏳</span>
    </div>
    <div class="task-desc">${escapeHtml(descText)}</div>
  `;
  // Toggle the task group open/closed; per-turn cards keep their own toggle.
  header.onclick = () => group.classList.toggle('open');

  const body = document.createElement('div');
  body.className = 'task-body';

  // Nested player turns live in their own indented container with a guide line.
  const turns = document.createElement('div');
  turns.className = 'task-turns';

  group.appendChild(header);
  group.appendChild(body);
  body.appendChild(turns);
  chatScroll.appendChild(group);

  // Stash the task fields so the master card / a flushed trace can surface them.
  group.dataset.successCriteria = evt.success_criteria || '';
  group.dataset.title = evt.title || '';
  group.dataset.description = evt.description || '';

  currentTaskGroup = group;
  currentTaskBody = turns;

  // Flush a master trace that arrived before this group existed.
  const pending = pendingMasterTraces[taskIndex];
  if (pending) {
    delete pendingMasterTraces[taskIndex];
    renderMasterTrace(pending);
  }

  autoScroll();
}

function renderMasterTrace(evt) {
  const taskIndex = evt.task_index;
  const group = findTaskGroup(taskIndex);

  // The master trace for task N is emitted just before task_started{N}; if the
  // group doesn't exist yet, buffer and let startNewTask flush it.
  if (!group) {
    pendingMasterTraces[taskIndex] = evt;
    return;
  }

  const body = group.querySelector('.task-body');
  if (!body) return;

  // Replay-safe: don't double-render if a master block already exists.
  if (body.querySelector('.master-block')) return;

  const block = document.createElement('div');
  block.className = 'master-block';

  const header = document.createElement('div');
  header.className = 'master-block-header';
  const modelStr = evt.model_used ? ' · ' + evt.model_used : '';
  const costStr = (evt.cost_usd != null) ? ' · $' + Number(evt.cost_usd).toFixed(4) : '';
  header.textContent = '🧭 TaskMaster' + modelStr + costStr;

  const mbody = document.createElement('div');
  mbody.className = 'master-block-body';

  // Structured "output card": the master's task (title), its 1-4 paragraph plan
  // (description), the success criteria, and (added below) its rating of the
  // previous task. This is the agent's RESULT, so it is appended at the BOTTOM of
  // the block — after the input + reasoning — so the trace reads chronologically.
  const card = document.createElement('div');
  card.className = 'master-card';

  const cardTitle = group.dataset.title || '';
  if (cardTitle) {
    const r = document.createElement('div');
    r.className = 'master-card-row';
    r.innerHTML = '<span class="master-card-label">📋 Task</span>' + escapeHtml(cardTitle);
    card.appendChild(r);
  }

  const cardDesc = group.dataset.description || '';
  if (cardDesc) {
    const r = document.createElement('div');
    r.className = 'master-card-row';
    const lbl = document.createElement('span');
    lbl.className = 'master-card-label';
    lbl.textContent = '🧭 Plan';
    const descEl = document.createElement('div');
    descEl.className = 'master-card-desc';
    descEl.textContent = cardDesc;
    r.appendChild(lbl);
    r.appendChild(descEl);
    card.appendChild(r);
  }

  const crit = group.dataset.successCriteria || '';
  if (crit) {
    const r = document.createElement('div');
    r.className = 'master-card-row';
    r.innerHTML = '<span class="master-card-label">🎯 Success criteria</span>' + escapeHtml(crit);
    card.appendChild(r);
  }

  // (The output card built above is appended at the BOTTOM of the block, after
  // the input and reasoning — NOT here at the top.)

  // Reuse the same trace-replay rendering used by renderTurnTrace, but the
  // master's final_result carries task fields (rendered in the output card), so
  // skip it.
  const messages = evt.messages || [];
  // Live view: the verbose system prompt and the input-prompt TEXT are
  // report-only. Here we keep just the screenshots the master actually saw
  // (under the Input tab) plus its reasoning, tool calls, and result. One image
  // (start) on cold-start, two (previous task start + end) on a handoff.
  const masterImgs = (evt.input_images || []).filter(im => im && im.data_url);
  if (masterImgs.length) {
    const det = document.createElement('details');
    det.innerHTML = '<summary style="color:var(--text-dim);cursor:pointer;font-size:11px;">📷 Screens the master saw</summary>';
    const strip = document.createElement('div');
    strip.className = 'master-thumbs';
    for (const im of masterImgs) {
      const fig = document.createElement('figure');
      fig.className = 'master-thumb';
      fig.innerHTML = '<img src="' + im.data_url + '" alt="' + escapeHtml(im.label || '') + '"/>' +
        '<figcaption>' + escapeHtml(im.label || '') + '</figcaption>';
      strip.appendChild(fig);
    }
    det.appendChild(strip);
    mbody.appendChild(det);
  }
  for (const msg of messages) {
    const role = msg.role || msg.kind || '';
    if (role === 'thinking') {
      addBoxTo(mbody, 'thinking', '💭 Thinking', msg.content || '', true);
    }
    else if (role === 'tool_call') {
      const name = msg.tool_name || '?';
      if (name === 'final_result') continue;  // task fields already on header
      let cargs = msg.args;
      if (typeof cargs !== 'string') cargs = JSON.stringify(cargs, null, 2);
      addBoxTo(mbody, 'tool', '🔧 ' + name, cargs || '');
    }
    else if (role === 'tool_result') {
      const content = msg.content || '';
      if (content === 'Final result processed.') continue;
      if (content.startsWith('Tool not executed')) continue;
      addBoxTo(mbody, 'tool', '↳ Response', content);
    }
    else if (role === 'retry') {
      addBoxTo(mbody, 'error', '🔄 Retry', msg.content || 'Validation failed — retrying.');
    }
  }

  // Append the master's rating of the PREVIOUS task as the final row of the
  // output card (produced at THIS invocation; null on the cold-start turn), then
  // place the whole output card at the BOTTOM of the block.
  const rop = masterRatingOfPrevious(evt.messages);
  const rr = document.createElement('div');
  rr.className = 'master-card-row';
  if (rop) {
    const g = STATUS_GLYPH[(rop.status || '').toLowerCase()] || '➖';
    let html = '<span class="master-card-label">⚖️ Rating of the previous task</span>' +
      '<strong>' + g + ' ' + capitalize(rop.status || '?') + '</strong>';
    if (rop.reasoning) html += ' — ' + escapeHtml(rop.reasoning);
    rr.innerHTML = html;
  } else {
    rr.innerHTML = '<span class="master-card-label">⚖️ Rating of the previous task</span>' +
      '<span style="color:var(--text-dim);">First task — no previous task to rate.</span>';
  }
  card.appendChild(rr);
  card.classList.add('master-output');
  mbody.appendChild(card);

  block.appendChild(header);
  block.appendChild(mbody);
  // Master block goes ABOVE the player turns (Decision 1).
  body.insertBefore(block, body.firstChild);

  // Roll the master cost into the task-cost span.
  if (evt.cost_usd != null) {
    group.dataset.masterCost = String(evt.cost_usd);
    updateTaskCost(group);
  }

  autoScroll();
}

function completeTask(evt) {
  // Backward-stamp: task_completed{N} can arrive AFTER task N+1 already
  // started, so always resolve the target group by index, never "current".
  const group = findTaskGroup(evt.task_index);
  if (!group) return;

  const rating = evt.rating || {};
  const status = rating.status || 'other';
  const badgeInfo = BADGE[status] || BADGE.other;

  // Only the compact status badge is backfilled onto the finished task's header.
  // The verbose verdict + reasoning is NOT shown here — it appears (chronologically)
  // as the NEXT master invocation's "rating of the previous task", and the Player's
  // hand-back appears on its own final turn card. This keeps the trace readable.
  const badge = group.querySelector('.task-badge');
  if (badge) {
    badge.className = 'task-badge ' + badgeInfo.cls;
    badge.textContent = badgeInfo.glyph;
    badge.title = badgeInfo.label;
  }
  autoScroll();
}

function badgeColor(status) {
  if (status === 'succeeded') return '#7ddf64';
  if (status === 'failed') return '#e94560';
  if (status === 'partial') return '#ffce54';
  return '#bc8cff';
}

function capitalize(s) {
  return s ? s.charAt(0).toUpperCase() + s.slice(1) : s;
}

function updateTaskCount(group) {
  const turns = group.querySelector('.task-turns');
  const n = turns ? turns.querySelectorAll('.turn-block').length : 0;
  const span = group.querySelector('.task-count');
  if (span) span.textContent = n + (n === 1 ? ' turn' : ' turns');
}

function updateTaskCost(group) {
  const turns = group.querySelector('.task-turns');
  let total = parseFloat(group.dataset.masterCost || '0') || 0;
  if (turns) {
    for (const b of turns.querySelectorAll('.turn-block')) {
      total += parseFloat(b.dataset.cost || '0') || 0;
    }
  }
  const span = group.querySelector('.task-cost');
  if (span) span.textContent = total > 0 ? '$' + total.toFixed(4) : '';
}

function escapeHtml(s) {
  if (typeof s !== 'string') s = String(s == null ? '' : s);
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function startNewTurn(turnNum) {
  // Replay/reconnect-safe: reuse an existing block for this global turn number
  // instead of appending a duplicate (turn numbers are globally unique).
  const dupe = chatScroll.querySelector('.turn-block[data-turn="' + turnNum + '"]');
  if (dupe) {
    if (currentTurnBlock && currentTurnBlock !== dupe) {
      currentTurnBlock.classList.remove('active');
    }
    currentTurnBlock = dupe;
    currentTurnBody = dupe.querySelector('.turn-body');
    return;
  }

  // Append into the current task body if grouped; else stream flat (legacy
  // path — runs that never emit task_started behave exactly as before).
  const target = currentTaskBody || chatScroll;

  // Within-task turn number M, derived by position in the current task body.
  let label = 'Turn ' + turnNum;
  if (currentTaskGroup) {
    const within = target.querySelectorAll('.turn-block').length + 1;
    label = 'Turn ' + currentTaskGroup.dataset.task + '.' + within;
  } else {
    // Legacy (no-task) path: preserve today's "keep last 2 turns open,
    // collapse older" heuristic so non-TM runs render exactly as before.
    // Grouped runs collapse at the task level instead (Decision 6).
    const blocks = chatScroll.querySelectorAll('.turn-block');
    for (const b of blocks) {
      const bTurn = parseInt(b.dataset.turn);
      if (bTurn < turnNum - 1) {
        b.classList.remove('active', 'open');
      }
    }
  }

  if (currentTurnBlock) {
    currentTurnBlock.classList.remove('active');
  }

  state.currentTurn = turnNum;

  const block = document.createElement('div');
  block.className = 'turn-block active open';
  block.dataset.turn = turnNum;

  const header = document.createElement('div');
  header.className = 'turn-header';
  header.innerHTML = `
    <span class="turn-arrow">▶</span>
    <span class="turn-label">${label}</span>
    <span class="turn-summary" id="turnSummary${turnNum}"></span>
    <span class="turn-cost" id="turnCost${turnNum}"></span>
  `;
  header.onclick = () => block.classList.toggle('open');

  const body = document.createElement('div');
  body.className = 'turn-body';

  block.appendChild(header);
  block.appendChild(body);
  target.appendChild(block);

  currentTurnBlock = block;
  currentTurnBody = body;

  // Refresh the current task header's turn count.
  if (currentTaskGroup) updateTaskCount(currentTaskGroup);

  autoScroll();
}

function renderTurnTrace(evt) {
  // turn_trace is used only during replay (page loaded after turn completed).
  // During live streaming, llm_thinking/llm_output/tool_call events already
  // populated the turn body. If the body already has content, skip replay.
  const turnNum = evt.turn;
  let turnBody = currentTurnBody;

  // Find matching turn block if not the current turn
  if (!turnBody || (currentTurnBlock && currentTurnBlock.dataset.turn != turnNum)) {
    const blocks = chatScroll.querySelectorAll('.turn-block');
    for (const b of blocks) {
      if (b.dataset.turn == turnNum) {
        turnBody = b.querySelector('.turn-body');
        break;
      }
    }
  }

  if (!turnBody) return;

  // If body already has streaming content, don't duplicate
  if (turnBody.children.length > 0) return;

  // Replay from trace (page loaded after run or reconnected)
  const messages = evt.messages || [];

  for (const msg of messages) {
    const role = msg.role || msg.kind || '';

    // Live view: the system prompt + input-prompt text are report-only (skip).
    if (role === 'thinking') {
      addBoxTo(turnBody, 'thinking', '💭 Thinking', msg.content || '', true);
    }
    else if (role === 'tool_call') {
      const name = msg.tool_name || '?';
      if (name === 'final_result') {
        // Render the final output (same as llm_output handling)
        let fargs = msg.args || '';
        if (typeof fargs === 'string') { try { fargs = JSON.parse(fargs); } catch(e) {} }
        if (typeof fargs === 'object') {
          let lines = [];
          const fGrade = fargs.last_turn_succeeded;
          if (fGrade === true) lines.push('✅ Last turn: succeeded');
          else if (fGrade === false) lines.push('❌ Last turn: failed');
          else if (fGrade === null) lines.push('➖ Last turn: n/a (first turn)');
          if (fargs.reasoning) lines.push('🧠 ' + fargs.reasoning);
          if (lines.length) addBoxTo(turnBody, 'output', '💬 Output', lines.join('\n\n'));
          if (fargs.inputs && fargs.inputs.length) {
            const inputs = Array.isArray(fargs.inputs) ? JSON.stringify(fargs.inputs) : fargs.inputs;
            addBoxTo(turnBody, 'action', '🎮 Action', inputs);
          }
          if (fargs.return_to_taskmaster) addBoxTo(turnBody, 'handback', '↩️ Return to TaskMaster', fmtHandback(fargs.return_to_taskmaster));
          const fMemRaw = fargs.memory_updates || '';
          if (typeof fMemRaw === 'string' && fMemRaw.length > 0 && fMemRaw.toLowerCase() !== 'none') {
            let fMemDisplay = fMemRaw;
            try { fMemDisplay = JSON.stringify(JSON.parse(fMemRaw), null, 2); } catch(e) {}
            addBoxTo(turnBody, 'memory', '🧠 Memory Update', fMemDisplay);
          } else {
            addBoxTo(turnBody, 'memory', '🧠 Memory Update', '(no changes)');
          }
        }
        continue;
      }
      addBoxTo(turnBody, 'tool', '🔧 ' + name, msg.args || '');
    }
    else if (role === 'tool_result') {
      const content = msg.content || '';
      if (content === 'Final result processed.') continue;
      if (content.startsWith('Tool not executed')) continue;
      addBoxTo(turnBody, 'tool', '↳ Response', content);
    }
    else if (role === 'retry') {
      addBoxTo(turnBody, 'error', '🔄 Retry', msg.content || 'Validation failed — retrying.');
    }
    // role === 'final_result' is handled above in tool_call with name === 'final_result'
  }

  autoScroll();
}

function renderTurnExplanation(evt) {
  const exp = evt.explanation || {};
  const summary = document.getElementById('turnSummary' + evt.turn);
  if (summary) {
    summary.textContent = truncate(exp.reasoning || '', 60);
  }
}

function renderTurnUsage(evt) {
  const turnNum = evt.turn || state.currentTurn;
  const cost = evt.cost_usd || 0;
  const costEl = document.getElementById('turnCost' + turnNum);
  if (costEl) {
    costEl.textContent = '$' + cost.toFixed(4);
  }
  // Stash cost on the turn block + roll up into the owning task header.
  const block = chatScroll.querySelector('.turn-block[data-turn="' + turnNum + '"]');
  if (block) {
    block.dataset.cost = String(cost);
    const group = block.closest('.task-group');
    if (group) updateTaskCost(group);
  }
}

function addBox(variant, title, content, markdown) {
  const target = currentTurnBody || chatScroll;
  const box = document.createElement('div');
  box.className = 'entry-box box-' + variant;

  const header = document.createElement('div');
  header.className = 'entry-box-header';
  header.textContent = title;

  const body = document.createElement('div');
  body.className = 'entry-box-body';
  if (markdown) {
    body.innerHTML = renderMarkdownLight(content);
  } else {
    body.textContent = content;
  }

  box.appendChild(header);
  box.appendChild(body);
  target.appendChild(box);
  autoScroll();
}

function renderOcrFlush(evt) {
  const n = evt.n_captures || 0;
  const dur = evt.duration || 0;
  const cleaned = evt.cleaned || '';
  const raw = evt.raw || {};
  const cost = evt.cost_usd || 0;
  if (n === 0 && !cleaned) return;  // nothing to show

  const target = currentTurnBody || chatScroll;
  const box = document.createElement('div');
  box.className = 'entry-box box-ocr';

  const header = document.createElement('div');
  header.className = 'entry-box-header';
  const costStr = cost > 0 ? ' | $' + cost.toFixed(5) : '';
  header.textContent = '📝 OCR (' + n + ' captures, ' + dur + 's' + costStr + ')';

  const body = document.createElement('div');
  body.className = 'entry-box-body';

  const cleanedPre = document.createElement('pre');
  cleanedPre.textContent = cleaned || '(empty)';
  cleanedPre.style.whiteSpace = 'pre-wrap';
  cleanedPre.style.margin = '0';
  body.appendChild(cleanedPre);

  if (Object.keys(raw).length > 0) {
    const details = document.createElement('details');
    const sum = document.createElement('summary');
    sum.textContent = 'Raw buffer (' + Object.keys(raw).length + ')';
    details.appendChild(sum);
    const pre = document.createElement('pre');
    pre.textContent = JSON.stringify(raw, null, 2);
    details.appendChild(pre);
    body.appendChild(details);
  }

  box.appendChild(header);
  box.appendChild(body);
  target.appendChild(box);
  autoScroll();
}

function addChatEntry(cls, text) {
  const target = currentTurnBody || chatScroll;
  addEntryTo(target, cls, text);
  autoScroll();
}

function renderMarkdownLight(text) {
  let html = text
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;');
  html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  return html;
}

function addEntryTo(parent, cls, text) {
  const div = document.createElement('div');
  div.className = 'chat-entry ' + cls;
  div.textContent = text;
  parent.appendChild(div);
}

function addBoxTo(parent, variant, title, content, markdown) {
  const box = document.createElement('div');
  box.className = 'entry-box box-' + variant;
  const header = document.createElement('div');
  header.className = 'entry-box-header';
  header.textContent = title;
  const body = document.createElement('div');
  body.className = 'entry-box-body';
  if (markdown) {
    body.innerHTML = renderMarkdownLight(content);
  } else {
    body.textContent = content;
  }
  box.appendChild(header);
  box.appendChild(body);
  parent.appendChild(box);
}

function addSystemEntry(text) {
  const div = document.createElement('div');
  div.className = 'chat-entry entry-system';
  div.textContent = '⚙ ' + text;
  chatScroll.appendChild(div);
  autoScroll();
}

// --- Stats ---
function updateStats(stats) {
  document.getElementById('statCost').textContent = '$' + (stats.cost || 0).toFixed(4);
  document.getElementById('statTurn').textContent = stats.turns || 0;
  document.getElementById('statTokens').textContent =
    Math.round((stats.input_tokens || 0) / 1000) + 'k / ' +
    Math.round((stats.output_tokens || 0) / 1000) + 'k';
}

// --- State tree ---
function renderStateTree(data) {
  const container = document.getElementById('stateTree');
  container.innerHTML = '';
  if (!data || Object.keys(data).length === 0) {
    container.textContent = '(empty)';
    return;
  }
  container.appendChild(renderJsonNode(data, true));
}

function renderJsonNode(value, expanded) {
  if (value === null) {
    const s = document.createElement('span');
    s.className = 'json-null';
    s.textContent = 'null';
    return s;
  }
  if (typeof value === 'boolean') {
    const s = document.createElement('span');
    s.className = 'json-bool';
    s.textContent = String(value);
    return s;
  }
  if (typeof value === 'number') {
    const s = document.createElement('span');
    s.className = 'json-number';
    s.textContent = String(value);
    return s;
  }
  if (typeof value === 'string') {
    const s = document.createElement('span');
    s.className = 'json-string';
    s.textContent = '"' + value + '"';
    return s;
  }
  if (Array.isArray(value)) {
    const wrapper = document.createElement('span');
    if (value.length === 0) {
      wrapper.innerHTML = '<span class="json-bracket">[]</span>';
      return wrapper;
    }
    const toggle = document.createElement('span');
    toggle.className = 'json-toggle';
    toggle.textContent = expanded ? '▾ [' : '▸ [...]';
    const children = document.createElement('div');
    children.className = 'json-children' + (expanded ? '' : ' json-hidden');
    value.forEach((item, i) => {
      const row = document.createElement('div');
      row.appendChild(renderJsonNode(item, false));
      if (i < value.length - 1) {
        const comma = document.createTextNode(',');
        row.appendChild(comma);
      }
      children.appendChild(row);
    });
    const close = document.createElement('span');
    close.className = 'json-bracket';
    close.textContent = ']';
    toggle.onclick = () => {
      children.classList.toggle('json-hidden');
      toggle.textContent = children.classList.contains('json-hidden') ? '▸ [...]' : '▾ [';
    };
    wrapper.appendChild(toggle);
    wrapper.appendChild(children);
    wrapper.appendChild(close);
    return wrapper;
  }
  if (typeof value === 'object') {
    const keys = Object.keys(value);
    const wrapper = document.createElement('span');
    if (keys.length === 0) {
      wrapper.innerHTML = '<span class="json-bracket">{}</span>';
      return wrapper;
    }
    const toggle = document.createElement('span');
    toggle.className = 'json-toggle';
    toggle.textContent = expanded ? '▾ {' : '▸ {...}';
    const children = document.createElement('div');
    children.className = 'json-children' + (expanded ? '' : ' json-hidden');
    keys.forEach((key, i) => {
      const row = document.createElement('div');
      const keySpan = document.createElement('span');
      keySpan.className = 'json-key';
      keySpan.textContent = key + ': ';
      row.appendChild(keySpan);
      row.appendChild(renderJsonNode(value[key], expanded));
      if (i < keys.length - 1) {
        row.appendChild(document.createTextNode(','));
      }
      children.appendChild(row);
    });
    const close = document.createElement('span');
    close.className = 'json-bracket';
    close.textContent = '}';
    toggle.onclick = () => {
      children.classList.toggle('json-hidden');
      toggle.textContent = children.classList.contains('json-hidden') ? '▸ {...}' : '▾ {';
    };
    wrapper.appendChild(toggle);
    wrapper.appendChild(children);
    wrapper.appendChild(close);
    return wrapper;
  }
  const s = document.createElement('span');
  s.textContent = String(value);
  return s;
}

// --- Connection status ---
function updateStatus() {
  const se = document.getElementById('screenStatus');
  const ee = document.getElementById('eventsStatus');
  se.textContent = state.screenConnected ? 'connected' : 'disconnected';
  se.className = state.screenConnected ? 'connected' : 'disconnected';
  ee.textContent = state.eventsConnected ? 'connected' : 'disconnected';
  ee.className = state.eventsConnected ? 'connected' : 'disconnected';

  const banner = document.getElementById('reconnectBanner');
  banner.classList.toggle('show', !state.screenConnected || !state.eventsConnected);
}

// --- Helpers ---
function truncate(s, max) {
  if (typeof s !== 'string') s = JSON.stringify(s) || '';
  return s.length > max ? s.slice(0, max) + '...' : s;
}

// --- Start ---
connectScreen();
connectEvents();
</script>
